<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:,">
<title>卫戍协议：规程 数据库</title>
<style>
  /* ===== 设计 Token：工业战术终端配色（对齐官方卫戍协议视觉） ===== */
  :root {
    /* 背景层 */
    --bg: #101311;
    --bg-deep: #0b0e0c;
    --bg-card: #191e1b;
    --bg-panel: #242c27;
    --bg-hover: #303a33;

    /* 品牌青绿 */
    --accent: #00e8b8;
    --accent-glow: #35f5cb;
    --accent-dim: #168d73;
    --accent-press: #00b990;
    --accent-soft: #123a31;

    /* 辅助语义色 */
    --gold: #e6b747;
    --gold-soft: rgba(230, 183, 71, 0.12);
    --red: #ef6b62;
    --red-soft: rgba(239, 107, 98, 0.12);
    --blue: #65bbd5;
    --blue-soft: rgba(101, 187, 213, 0.12);

    /* 文字层级 */
    --text: #e6e9e1;
    --text-dim: #bcc5bc;
    --text-mute: #89948a;
    --text-off: #626d64;

    /* 描边 / 分隔线 */
    --border: #2a332d;
    --border-strong: #3a463f;
    --line: rgba(230, 233, 225, 0.08);

    /* 阶位（保留游戏语义色相） */
    --tier-1: #c5c5c5;
    --tier-2: #ffffff;
    --tier-3: #46efbc;
    --tier-4: #33c9da;
    --tier-5: #f6c60f;
    --tier-6: #e88c1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  /* 滚动条：跟随主题青绿色 */
  * { scrollbar-width: thin; scrollbar-color: var(--border-strong) var(--bg-deep); }
  *::-webkit-scrollbar { width: 13.5px; height: 13.5px; }
  *::-webkit-scrollbar-track { background: var(--bg-deep); }
  *::-webkit-scrollbar-thumb { background: #35423a; border-radius: 3px; border: 3px solid var(--bg-deep); }
  *::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }
  *::-webkit-scrollbar-corner { background: var(--bg-deep); }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 21.75px;
    background:
      radial-gradient(ellipse 120% 80% at 50% -20%, #182019 0%, transparent 60%),
      linear-gradient(180deg, #121614 0%, #0e1210 100%);
    color: var(--text);
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* ===== 公共纹理层：扫描线 + 工业网格 + 暗角（统一在此处维护） ===== */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      repeating-linear-gradient(to bottom, rgba(230, 233, 225, 0.028) 0 1.5px, rgba(0, 0, 0, 0) 1.5px 4.5px),
      linear-gradient(to right, rgba(230, 233, 225, 0.022) 1.5px, transparent 1.5px),
      linear-gradient(to bottom, rgba(230, 233, 225, 0.022) 1.5px, transparent 1.5px);
    background-size: 100% 4.5px, 108px 108px, 108px 108px;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 75% 55% at 50% -12%, rgba(0, 232, 184, 0.07), transparent 70%),
      radial-gradient(ellipse 95% 75% at 50% 125%, rgba(0, 0, 0, 0.55), transparent 65%);
  }
  /* 全宽铺满：去掉 1400px 上限；所有尺寸按 100% 浏览器缩放（原 150% 观感）标定 1.5 倍 */
  .container {
    max-width: none;
    margin: 0;
    padding: 15px 21px 18px;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }
  header {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 12px 30px 10.5px;
    background:
      linear-gradient(180deg, rgba(0, 232, 184, 0.06), rgba(0, 232, 184, 0) 70%),
      linear-gradient(180deg, #1c231f 0%, #141816 100%);
    border-bottom: 1.5px solid var(--line);
    flex-shrink: 0;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: repeating-linear-gradient(to bottom, rgba(230, 233, 225, 0.03) 0 1.5px, transparent 1.5px 4.5px);
  }
  header::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1.5px;
    height: 1.5px;
    background: linear-gradient(90deg, transparent, var(--accent-dim) 18%, var(--accent) 50%, var(--accent-dim) 82%, transparent);
    opacity: 0.85;
  }
  header h1 {
    position: relative;
    font-size: 1.28em;
    font-weight: 700;
    color: var(--text);
    text-shadow: 0 0 24px rgba(0, 232, 184, 0.28);
    letter-spacing: 10.5px;
    text-indent: 10.5px;
    line-height: 1.4;
  }

  .tabs {
    display: flex;
    gap: 3px;
    margin-bottom: 15px;
    border-bottom: 1.5px solid var(--border);
    flex-shrink: 0;
  }
  .tab {
    padding: 12px 30px;
    cursor: pointer;
    color: var(--text-mute);
    border: none;
    background: transparent;
    font-size: 0.95em;
    font-weight: 600;
    letter-spacing: 1.5px;
    font-family: inherit;
    transition: color 0.18s, background 0.18s, border-color 0.18s;
    border-bottom: 3px solid transparent;
    margin-bottom: -1.5px;
  }
  .tab:hover { color: var(--text); background: rgba(0, 232, 184, 0.05); }
  .tab.active {
    color: var(--accent-glow);
    background: linear-gradient(180deg, rgba(0, 232, 184, 0.13), rgba(0, 232, 184, 0.01));
    border-bottom-color: var(--accent);
    text-shadow: 0 0 21px rgba(0, 232, 184, 0.4);
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Table view */
  .toolbar {
    display: flex;
    gap: 18px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-box {
    flex: 1;
    min-width: 300px;
    padding: 10.5px 21px;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 4.5px;
    color: var(--text);
    font-size: 0.95em;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-box::placeholder { color: var(--text-off); }
  .search-box:focus { border-color: var(--accent-dim); box-shadow: inset 0 0 27px rgba(0, 232, 184, 0.05); }
  .filter-select {
    padding: 10.5px 18px;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 4.5px;
    color: var(--text);
    font-size: 0.95em;
    font-family: inherit;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .filter-select:focus, .filter-select:hover { border-color: var(--accent-dim); }
  .filter-select option { background: var(--bg-panel); color: var(--text); }

  /* 多选下拉 */
  .ms-wrap { position: relative; }
  .ms-toggle {
    padding: 10.5px 18px;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 4.5px;
    color: var(--text);
    font-size: 0.95em;
    font-family: inherit;
    cursor: pointer;
    outline: none;
    white-space: nowrap;
    min-width: 225px;
    text-align: left;
    transition: border-color 0.2s;
  }
  .ms-toggle:hover, .ms-toggle.open { border-color: var(--accent-dim); color: var(--accent-glow); }
  .ms-count {
    display: inline-block;
    min-width: 25.5px;
    padding: 0 7.5px;
    margin-left: 9px;
    border-radius: 3px;
    background: var(--accent);
    color: #0a1411;
    font-size: 0.78em;
    font-weight: 700;
    text-align: center;
  }
  .ms-panel {
    display: none;
    position: absolute;
    top: calc(100% + 9px);
    left: 0;
    z-index: 100;
    width: 360px;
    max-height: 510px;
    overflow-y: auto;
    padding: 12px;
    background: var(--bg-panel);
    border: 1.5px solid var(--border-strong);
    border-radius: 4.5px;
    box-shadow: 0 21px 51px rgba(0, 0, 0, 0.6);
  }
  .ms-panel.open { display: block; }
  .ms-panel label {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7.5px 12px;
    border-radius: 3px;
    font-size: 0.92em;
    color: var(--text-dim);
    cursor: pointer;
  }
  .ms-panel label:hover { background: var(--bg-hover); color: var(--text); }
  .ms-panel input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }
  .ms-actions {
    display: flex;
    gap: 12px;
    padding: 12px 6px 3px;
    margin-top: 6px;
    border-top: 1.5px solid var(--border);
  }
  .ms-action {
    flex: 1;
    padding: 6px;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 3px;
    color: var(--text-mute);
    font-size: 0.8em;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
  }
  .ms-action:hover { border-color: var(--accent-dim); color: var(--accent-glow); }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: rgba(25, 30, 27, 0.72);
    border: 1.5px solid var(--border);
    border-radius: 0;
  }
  thead th {
    background: linear-gradient(to bottom, #232b26, #191f1b);
    color: var(--text-dim);
    padding: 13.5px 15px;
    text-align: left;
    font-weight: 600;
    font-size: 0.82em;
    letter-spacing: 0.09em;
    white-space: nowrap;
    position: relative;
    border-bottom: 1.5px solid var(--accent-dim);
  }
  thead th::after {
    content: '';
    position: absolute; left: 15px; bottom: -1.5px;
    width: 21px; height: 1.5px;
    background: var(--accent);
  }
  tbody tr {
    border-bottom: 1.5px solid var(--line);
    transition: background 0.15s;
  }
  tbody tr:nth-child(even) { background: rgba(36, 44, 39, 0.35); }
  tbody tr:hover { background: rgba(48, 58, 51, 0.62); }
  tbody td {
    padding: 10.5px 15px;
    vertical-align: middle;
    font-size: 0.92em;
    border-bottom: 1.5px solid var(--line);
  }
  .op-name { font-weight: 600; color: var(--text); }
  .op-cell {
    display: flex;
    align-items: center;
    gap: 13.5px;
  }
  .avatar {
    width: 57px;
    height: 57px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid var(--accent-dim);
    background: var(--bg-card);
    flex-shrink: 0;
  }
  .avatar-sm {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid var(--accent-dim);
    background: var(--bg-card);
    flex-shrink: 0;
  }
  .avatar-placeholder {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-card);
    border: 1.5px dashed var(--border-strong);
    color: var(--text-mute);
    font-size: 0.7em;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .pos-badge {
    display: inline-block;
    padding: 1.5px 12px;
    border-radius: 3px;
    font-size: 0.78em;
    font-weight: 600;
    background: var(--blue-soft);
    color: var(--blue);
    border: 1.5px solid rgba(101, 187, 213, 0.38);
  }
  .pos-badge.core { background: var(--accent-soft); color: var(--accent-glow); border-color: var(--accent-dim); }
  .pos-badge.output { background: var(--gold-soft); color: var(--gold); border-color: rgba(230, 183, 71, 0.42); }
  .pos-badge.late { background: rgba(154, 142, 176, 0.12); color: #b6a9c9; border-color: rgba(154, 142, 176, 0.38); }
  .pos-badge.assist { background: rgba(137, 148, 138, 0.12); color: var(--text-dim); border-color: var(--border-strong); }
  .pos-badge.general { background: var(--blue-soft); color: var(--blue); border-color: rgba(101, 187, 213, 0.42); }
  .covenant-tag {
    display: inline-block;
    padding: 1.5px 12px;
    margin: 3px;
    background: var(--accent-soft);
    border: 1.5px solid rgba(22, 141, 115, 0.55);
    border-radius: 3px;
    font-size: 0.82em;
    color: var(--accent-glow);
    cursor: pointer;
    transition: border-color 0.18s, background 0.18s;
  }
  .covenant-tag:hover {
    background: rgba(18, 58, 49, 0.92);
    border-color: var(--accent-dim);
  }
  .tier-badge {
    display: inline-block;
    width: 39px;
    height: 39px;
    line-height: 36px;
    text-align: center;
    border-radius: 50%;
    font-weight: bold;
    font-size: 0.86em;
  }
  .tier-1 { background: rgba(197,197,197,0.16); color: var(--tier-1); border: 1.5px solid rgba(197,197,197,0.55); }
  .tier-2 { background: rgba(255,255,255,0.12); color: var(--tier-2); border: 1.5px solid rgba(255,255,255,0.5); }
  .tier-3 { background: rgba(70,239,188,0.12); color: var(--tier-3); border: 1.5px solid rgba(70,239,188,0.5); }
  .tier-4 { background: rgba(51,201,218,0.12); color: var(--tier-4); border: 1.5px solid rgba(51,201,218,0.5); }
  .tier-5 { background: rgba(230,183,71,0.14); color: var(--tier-5); border: 1.5px solid rgba(230,183,71,0.5); }
  .tier-6 { background: rgba(232,140,26,0.14); color: var(--tier-6); border: 1.5px solid rgba(232,140,26,0.5); }
  .skill-type {
    display: inline-block;
    padding: 1.5px 10.5px;
    background: rgba(230, 233, 225, 0.04);
    border: 1.5px solid var(--line);
    border-radius: 3px;
    font-size: 0.86em;
    color: var(--text-dim);
  }
  .trait-text { font-size: 0.94em; color: var(--text-dim); max-width: 840px; }
  .empty-state {
    text-align: center;
    padding: 66px 30px;
    color: var(--text-mute);
    font-size: 0.9em;
    letter-spacing: 0.06em;
  }

  /* Covenant grid view */
  .covenant-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }
  .covenant-card {
    background: linear-gradient(160deg, #1f2723 0%, #171c1a 100%);
    border: 1.5px solid var(--border);
    border-radius: 3px;
    padding: 24px 21px;
    cursor: pointer;
    transition: border-color 0.22s, background 0.22s;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .covenant-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
    opacity: 0.7;
    transition: opacity 0.25s;
  }
  .covenant-card:hover {
    border-color: var(--accent-dim);
    background: linear-gradient(160deg, #232c27 0%, #1b211e 100%);
  }
  .covenant-card:hover::before { opacity: 1; }
  .covenant-card-icon {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 12px;
  }
  .cov-icon {
    width: 78px;
    height: 78px;
    object-fit: contain;
  }
  .cov-icon-lg {
    width: 60px;
    height: 60px;
    object-fit: contain;
  }
  .covenant-card-name {
    font-size: 1.02em;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }
  .covenant-card-count {
    font-size: 0.8em;
    color: var(--text-mute);
  }

  /* 盟约分组区块（核心盟约 / 附加盟约） */
  .cov-block {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
    margin-bottom: 33px;
  }
  .cov-block-header {
    grid-column: 1 / -1;
    font-size: 0.88em;
    font-weight: 600;
    line-height: 1.3;
    padding: 7.5px 18px;
    margin-bottom: 3px;
    border-radius: 0;
    letter-spacing: 0.14em;
    border-left-width: 4.5px;
    border-left-style: solid;
  }
  .cov-block-nation {
    color: var(--accent-glow);
    background: linear-gradient(to right, rgba(0, 232, 184, 0.09), transparent 70%);
    border-left-color: var(--accent);
  }
  .cov-block-mech {
    color: var(--text-dim);
    background: linear-gradient(to right, rgba(137, 148, 138, 0.1), transparent 70%);
    border-left-color: var(--text-off);
  }

  .covenant-header {
    background: linear-gradient(165deg, #1e2622 0%, #171c1a 100%);
    border: 1.5px solid var(--border);
    border-left: 3px solid var(--accent-dim);
    border-radius: 0;
    padding: 27px 33px;
    margin-bottom: 27px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: flex-start;
    gap: 24px;
  }
  .covenant-header::after {
    content: '';
    position: absolute; right: 15px; top: 12px;
    width: 39px; height: 1.5px; background: var(--accent-dim); opacity: .6;
  }
  .cov-head-main { flex: 1 1 auto; min-width: 0; }
  .cov-h2 { display: flex; align-items: center; gap: 18px; }
  /* 大盟约连接图右上角：仅属于该大盟约、无法接入小盟约连接图的干员 */
  .cov-only-ops { flex: 0 1 auto; max-width: 58%; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
  .cov-only-title { font-size: 0.7em; color: var(--text-mute); letter-spacing: 0.08em; white-space: nowrap; }
  /* 右上角干员按阶分行：一行一阶，阶标对齐成列 */
  .cov-only-rows { display: flex; flex-direction: column; gap: 4px; }
  .cov-only-row { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; justify-content: flex-start; }
  .cov-only-row-tier { flex: 0 0 auto; width: 2.1em; text-align: right; font-size: 0.66em; color: var(--text-off); letter-spacing: 0.08em; }
  .cov-only-tag {
    display: inline-flex; align-items: baseline; gap: 3px;
    padding: 2px 9px;
    background: #0a110f;
    border: 1px solid rgba(79, 214, 255, 0.55);
    border-radius: 2px;
    color: #c6e8f4;
    font-family: inherit;
    font-size: 0.7em;
    line-height: 1.55;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .cov-only-tag:hover { background: rgba(79, 214, 255, 0.16); border-color: #4fd6ff; color: #eafaff; }
  /* 右上角被 Ban 的干员：红色框 + 红字，与图中红框呼应 */
  .cov-only-tag.banned { background: #1a0c0c; border-color: rgba(255, 82, 82, 0.7); color: #ff8a80; }
  .cov-only-tag.banned:hover { background: rgba(255, 82, 82, 0.16); border-color: #ff5252; color: #ffb3ad; }
  .covenant-header h2 {
    color: var(--text);
    margin-bottom: 12px;
    font-size: 1.34em;
    letter-spacing: 0.1em;
  }
  .covenant-desc {
    color: var(--text-mute);
    font-size: 0.92em;
    line-height: 1.85;
  }
  .tier-section {
    margin-bottom: 27px;
  }
  .tier-section-title {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 10.5px 21px;
    background: linear-gradient(to right, rgba(0, 232, 184, 0.1), transparent 65%);
    border-left: 3px solid var(--accent);
    border-radius: 0;
    margin-bottom: 15px;
    font-weight: 600;
    font-size: 0.92em;
    letter-spacing: 0.08em;
    color: var(--text);
  }
  .tier-section-title .tier-badge { flex-shrink: 0; }
  .op-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(390px, 1fr));
    gap: 15px;
  }
  .op-card {
    background: rgba(31, 39, 35, 0.72);
    border: 1.5px solid var(--border);
    border-radius: 3px;
    padding: 16.5px 19.5px;
    transition: border-color 0.18s, background 0.18s;
  }
  .op-card:hover {
    border-color: var(--accent-dim);
    background: rgba(38, 47, 42, 0.9);
  }
  /* 被 Ban 干员：红色描边 + 与正常深绿底同亮度的暗红底（保持可点开详情） */
  .op-card.banned {
    border-color: rgba(255, 82, 82, 0.72);
    background: rgba(50, 27, 25, 0.72);
    box-shadow: inset 0 0 0 1px rgba(255, 82, 82, 0.12);
  }
  .op-card.banned:hover {
    border-color: #ff5252;
    background: rgba(62, 34, 31, 0.9);
  }
  .op-card-ban {
    margin-left: 6px;
    padding: 0 5px;
    border: 1px solid rgba(255, 82, 82, 0.7);

  .tier-tab.active { background: var(--accent-soft); color: var(--accent-glow); border-color: var(--accent); box-shadow: inset 0 0 24px rgba(0,232,184,0.08); }
  /* 跳到筛选区时的短暂高亮 */

  /* Guide view */
  .guide-toolbar {

  .guide-row {

  .guide-chip {

  .guide-chip.active { background: var(--accent-soft); color: var(--accent-glow); border-color: var(--accent); box-shadow: inset 0 0 21px rgba(0,232,184,0.08); }
  .guide-cov-header { margin-bottom: 21px; }
  .guide-cov-header h2 { font-size: 1.32em; margin-bottom: 9px; color: var(--text); letter-spacing: 0.08em; }
  /* 攻略标题里的「激活所需 X 人」气泡：与「· 攻略」拉开距离，避免贴字 */
  .guide-cov-header h2 .cov-need-badge { margin-left: 18px; vertical-align: 1px; }
  .guide-cov-core {

  /* 盟约描述中的 <在场/达到/每叠加/首次到达 …> 触发条件：浅绿高亮 + 换行 */
  .cov-cond {

  .cov-need-badge {

  .cov-op-count-badge {
    display: inline-flex;

    letter-spacing: 0.06em;

    background: var(--bg-card);

  }
  .guide-cov-desc-foot { margin-top: 13.5px; }
  .guide-group { margin-bottom: 27px; scroll-margin-top: 96px; }
  .guide-group-title {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
    padding-bottom: 10.5px;

  .guide-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
  .guide-card {

  /* 攻略中的被 Ban 干员：红框 + 淡红底 + 红字角标，与盟约详情卡片一致 */
  .guide-card.banned {

  .guide-card.banned:hover { border-color: #ff5252; background: rgba(80, 44, 44, 0.92); }
  .guide-card.banned .guide-card-name { color: #ffb3ad; }

  .guide-card-ban {

  }
  .guide-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7.5px; }
  .guide-card-name { font-size: 0.9em; font-weight: bold; color: var(--text); line-height: 1.3; }

  .guide-card-covs { display: flex; flex-wrap: wrap; gap: 6px; }
  .guide-cov-tag {

  /* 攻略位置（浮窗内使用） */
  .guide-loc-list { display: flex; flex-direction: column; gap: 7.5px; }
  .guide-loc-item {
    display: flex;

  }
  .guide-loc-item:hover { border-color: var(--accent-dim); background: rgba(36, 44, 39, 0.8); }
  .guide-loc-cov {
    font-weight: bold;

  }
  .guide-loc-pos { color: var(--text-dim); }

  .covenant-stats {
    display: inline-block;
    margin-top: 12px;

    border-radius: 3px;
    font-size: 0.8em;
    color: var(--accent-glow);

    border: 1.5px solid var(--accent-dim);
  }
  .op-card { cursor: pointer; }
  .op-card-class {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72em;
    font-weight: normal;
    color: var(--text-dim);

  }
  .op-card-covs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .cov-mini {
    display: inline-block;
    padding: 1.5px 10.5px;
    border-radius: 3px;
    font-size: 0.72em;
  }

  /* ===== 职业图标 ===== */
  .class-icon { width: 27px; height: 27px; object-fit: contain; vertical-align: middle; }
  .class-icon-lg { width: 39px; height: 39px; object-fit: contain; vertical-align: middle; }

  /* ===== 职业标签（详情面板） ===== */
  .op-class-tag {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 3px 15px;
    border-radius: 3px;
    font-size: 0.82em;
    font-weight: 600;
    background: var(--blue-soft);
    color: var(--blue);
    border: 1.5px solid rgba(101, 187, 213, 0.38);
  }
  .avatar-xlg { width: 126px; height: 126px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-dim); background: var(--bg-card); flex-shrink: 0; }
  .avatar-md { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--accent-dim); background: var(--bg-card); flex-shrink: 0; }
  .avatar-bubble { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--accent-dim); background: var(--bg-card); flex-shrink: 0; }

  /* ===== 干员查询：方形干员卡（仅头像+名称，无外框；悬停头像加粗变绿） ===== */
  .tier-bubbles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 13.5px; }
  .op-bubble {
    background: none;
    border: none;
    border-radius: 3px;
    padding: 4.5px;
    cursor: pointer;
    text-align: center;
    transition: background 0.18s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7.5px;
  }
  .op-bubble-avatar-box {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 3px;
    border: 1.5px solid var(--border-strong);
    background: var(--bg-deep);
    overflow: hidden;
    display: block;
    transition: border-color 0.18s, transform 0.18s;
  }
  .op-bubble .op-bubble-avatar {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .op-bubble:hover .op-bubble-avatar-box {
    border-color: var(--accent);
    transform: translateY(-3px);
  }
  .op-bubble-name {
    font-size: 0.88em;
    font-weight: 600;
    color: var(--text);
    line-height: 1.25;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color 0.2s;
  }
  .op-bubble:hover .op-bubble-name { color: var(--accent-glow); }
  /* 干员查询：未命中的干员（蓝框 + 降饱和），排在每一阶命中结果之后 */
  .op-bubble.unselected { opacity: 0.72; }
  .op-bubble.unselected:hover { opacity: 1; }
  .op-bubble.unselected .op-bubble-avatar-box {
    border-color: rgba(79, 214, 255, 0.85);
    box-shadow: 0 0 0 1px rgba(79, 214, 255, 0.14), 0 0 10px rgba(79, 214, 255, 0.14);
  }
  .op-bubble.unselected .op-bubble-avatar { filter: grayscale(0.55) brightness(0.86); }
  .op-bubble.unselected .op-bubble-name { color: #9fe6ff; font-weight: normal; }
  .op-bubble.unselected:hover .op-bubble-avatar-box { border-color: #4fd6ff; }
  .op-bubble.unselected:hover .op-bubble-name { color: #d3f2ff; }
  /* 每阶内部的分组隔断：命中筛选 → 未满足筛选（蓝） → 已被 BAN */
  .tier-split {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 9px 0 3px;
    font-size: 0.72em;
    letter-spacing: 0.07em;
    color: rgba(159, 230, 255, 0.62);

  .tier-split::before, .tier-split::after {

    border-top: 1.5px dashed rgba(79, 214, 255, 0.26);

  .tier-split.ban { color: rgba(255, 138, 128, 0.75); }
  .tier-split.ban::before, .tier-split.ban::after { border-top-color: rgba(255, 82, 82, 0.26); }
  .tier-count-tip { margin-left: 12px; font-size: 0.72em; font-weight: normal; letter-spacing: 0.05em; }
  .tier-count-tip.unsel { color: rgba(159, 230, 255, 0.72); }
  .tier-count-tip.ban { color: rgba(255, 138, 128, 0.8); }
  /* 盟约选择区右下角空位：显示未选中干员 / 显示 Ban 位干员 两个开关 */
  .oq-switches {
    grid-column: span 4;
    justify-self: end;
    align-self: end;
    margin-bottom: 9px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    gap: 6px 18px;

  .oq-unsel-switch {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 0.76em;
    color: var(--text-mute);
    cursor: pointer;
    white-space: nowrap;

  .oq-unsel-switch .ban-switch { width: 42px; height: 21px; }
  .oq-unsel-switch .ban-switch .track::after { width: 14px; height: 14px; top: 2.5px; left: 2.5px; }
  .oq-unsel-switch .ban-switch input:checked + .track::after { transform: translateX(20px); }
  .oq-unsel-switch:hover { color: var(--accent-glow); }
  .oq-unsel-switch .ban-switch:has(input:checked) + span { color: var(--accent); }

  /* ===== 干员查询：筛选区（无外框，仅靠分组标题 + 横线 + 留白做结构划分） ===== */
  .oq-filter {
    margin-bottom: 18px;
    padding: 0;
    background: none;
    border: 0;
    border-radius: 0;
  }
  /* ===== 干员查询：分组重置按钮（嵌在分组标题条最右端） ===== */
  .cb-sec-title.has-reset::after { display: none; }
  .cb-sec-title .cb-sec-line { flex: 1; height: 1.5px; background: var(--border); }
  .oq-reset {
    padding: 3px 15px;
    background: rgba(255, 255, 255, 0.02);

    border-radius: 3px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 1em;
    letter-spacing: 0.08em;
    line-height: 1.5;
    cursor: pointer;
    transition: color 0.18s, border-color 0.18s, background 0.18s;

  .oq-reset:hover { color: var(--accent-glow); border-color: var(--accent-dim); }
  .oq-reset:active { color: var(--accent); border-color: var(--accent); background: rgba(0, 232, 184, 0.1); }
  /* ===== 干员查询：技能类型 / 触发效果筛选行 ===== */
  .qf-list { display: flex; flex-wrap: wrap; gap: 9px; min-width: 0; }
  /* 同一外框内的第二组筛选（技能类型 → 触发效果） */
  .qf-list + .cb-sec-title { margin-top: 15px; }

    padding: 4.5px 15px;
    background: rgba(255, 255, 255, 0.02);
    border: 1.5px solid var(--border);
    border-radius: 3px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.76em;
    letter-spacing: 0.05em;
    line-height: 1.7;
    cursor: pointer;
    transition: color 0.18s, border-color 0.18s, background 0.18s;
  }
  .qf-chip:hover { color: var(--accent-glow); border-color: var(--accent-dim); }
  .qf-chip.active {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(0, 232, 184, 0.1);
  }
  .qf-chip .qf-count { margin-left: 7.5px; font-size: 0.9em; color: var(--text-mute); }
  .qf-chip.active .qf-count { color: var(--accent-glow); }

  /* ===== 攻略卡片：大头像 + 职业 ===== */
  .guide-card-id { display: flex; align-items: center; gap: 15px; }
  .guide-card-idtext { min-width: 0; }
  .guide-card-meta { display: flex; align-items: center; gap: 9px; margin-top: 4.5px; }

  /* ===== 敌方情报（网格卡 + 右侧详情面板） ===== */
  .enemy-section { margin-bottom: 36px; }
  .enemy-section-title {
    font-size: 1.1em;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 12px;
    padding-bottom: 10.5px;

  }
  .enemy-note { font-size: 0.8em; color: var(--text-mute); margin-bottom: 18px; }
  /* 领袖 Boss：一行 4 个大头像（仿干员查询，无外框无内框） */
  .enemy-leader-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(174px, 1fr)); gap: 18px 15px; }
  .enemy-leader-card {
    background: none;
    border: none;
    padding: 4.5px;
    cursor: pointer;
    text-align: center;
    display: flex;
    flex-direction: column;

    gap: 9px;

  }
  .enemy-leader-card:hover { transform: translateY(-3px); }
  .enemy-leader-avatar {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 3px;
    object-fit: cover;
    border: 1.5px solid var(--border-strong);

    transition: border-color 0.18s;
  }
  .enemy-leader-card:hover .enemy-leader-avatar { border-color: var(--accent); }
  .enemy-leader-name { font-size: 0.9em; font-weight: 600; color: var(--text); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color 0.18s; }
  .enemy-leader-card:hover .enemy-leader-name { color: var(--accent-glow); }
  /* 战术特训 · 敌方分组：单个框 + 标题 + 直接文字（无嵌套框） */
  .enemy-train-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(318px, 1fr)); gap: 15px; }
  .enemy-train-card {
    background: rgba(31, 39, 35, 0.72);
    border: 1.5px solid var(--border);
    border-left: 3px solid var(--border-strong);
    border-radius: 0;
    padding: 16.5px 21px;
    cursor: pointer;
    transition: border-color 0.18s, background 0.18s;
  }
  .enemy-train-card:hover { border-color: var(--accent-dim); border-left-color: var(--accent); background: rgba(38, 47, 42, 0.9); }
  .enemy-train-card-name {
    font-size: 0.98em;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.08em;
    margin-bottom: 10.5px;
  }
  .enemy-train-card-desc { font-size: 0.84em; color: var(--text-dim); line-height: 1.6; margin-bottom: 7.5px; }
  .enemy-train-card-sub { font-size: 0.76em; color: var(--text-mute); }
  .enemy-train-badge {
    width: 100%;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 0;
    border: 1.5px solid var(--accent-dim);
    background: var(--bg-deep);
    font-size: 1.2em;
    font-weight: 700;
    color: var(--accent-glow);
    letter-spacing: 0.12em;
  }
  .enemy-avatar { width: 78px; height: 78px; border-radius: 3px; object-fit: cover; border: 1.5px solid var(--border-strong); background: var(--bg-deep); flex-shrink: 0; }
  .enemy-hp-table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
  .enemy-hp-table th, .enemy-hp-table td { border: 1.5px solid var(--line); padding: 6px 12px; text-align: center; }
  .enemy-hp-table th { color: var(--text-mute); background: rgba(0, 232, 184, 0.05); font-weight: 600; width: 34%; letter-spacing: 0.05em; }
  .enemy-hp-core { color: var(--red); font-weight: bold; }
  .enemy-dp-avatar { width: 96px; height: 96px; border-radius: 3px; object-fit: cover; border: 1.5px solid var(--border-strong); background: var(--bg-deep); flex-shrink: 0; }
  .enemy-dp-note { font-size: 0.76em; color: var(--text-mute); margin-top: 10.5px; }
  /* Boss 详情：名字 → 左2右7（大头像+重量 | 8词条4+4）→ 各模拟难度生命值 */
  .enemy-stats-layout { display: flex; gap: 21px; align-items: stretch; margin-bottom: 21px; }
  .enemy-stats-left { flex: 2; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .enemy-dp-big-avatar { width: 100%; max-width: 177px; aspect-ratio: 1 / 1; height: auto; border-radius: 3px; object-fit: cover; border: 1.5px solid var(--border-strong); background: var(--bg-deep); }
  .enemy-weight { font-size: 0.8em; color: var(--text-mute); background: var(--bg-deep); border: 1.5px solid var(--border); border-radius: 3px; padding: 4.5px 18px; letter-spacing: 0.08em; }
  .enemy-stats-right { flex: 7; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; align-content: center; }
  .enemy-stat { display: flex; align-items: baseline; justify-content: space-between; gap: 15px; padding: 9px 15px; background: var(--bg-deep); border: 1.5px solid var(--border); border-radius: 0; }
  .enemy-stat-label { font-size: 0.76em; color: var(--text-mute); letter-spacing: 0.05em; white-space: nowrap; }
  .enemy-stat-val { font-weight: 800; color: var(--blue); font-size: 1.02em; letter-spacing: 0.05em; white-space: nowrap; }
  .enemy-member-chips { display: flex; flex-wrap: wrap; gap: 7.5px; }
  .enemy-member-chip { padding: 3px 15px; background: var(--bg-deep); border: 1.5px solid var(--border); border-radius: 3px; font-size: 0.78em; color: var(--text-dim); }

  /* ===== 按盟约浏览（顶部盟约筛选顶盘：核心/附加 分组；小图标+文字，仿盟约一览） ===== */
  .cov-browse-toolbar { display: flex; flex-direction: column; gap: 9px; margin-bottom: 21px; padding: 15px 18px; background: rgba(25, 30, 27, 0.8); border: 1.5px solid var(--border); border-left: 3px solid var(--accent-dim); border-radius: 0; }
  .cb-sec-title { display: flex; align-items: center; gap: 9px; padding: 4.5px 12px; background: linear-gradient(90deg, rgba(0, 232, 184, 0.08), rgba(0, 232, 184, 0) 65%); border-left: 3px solid var(--accent-dim); font-size: 0.76em; font-weight: 700; letter-spacing: 0.14em; color: var(--text-dim); margin: 6px 0 9px; white-space: nowrap; }
  .cb-sec-title::after { content: ''; flex: 1; height: 1.5px; background: var(--border); }
  .cb-sec-dot { width: 10.5px; height: 10.5px; border-radius: 50%; flex-shrink: 0; }
  .cb-sec-dot.core { background: var(--accent); box-shadow: 0 0 7.5px rgba(0, 232, 184, 0.55); }
  .cb-sec-dot.attach { background: var(--text-off); box-shadow: none; }
  /* 10 列等分：核心盟约 10 个铺满一行，附加盟约 16 个自动折成 10+6 两行并与核心同列对齐 */
  .cb-list { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); justify-items: stretch; align-items: start; row-gap: 9px; min-width: 0; }
  .cb-chip {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 4.5px;
    padding: 4.5px 6px 3px;
    background: transparent;
    border: 1.5px solid transparent;
    border-radius: 3px;
    cursor: pointer;
    font-size: 0.68em;
    color: var(--text-mute);
    line-height: 1.15;
    white-space: nowrap;
    transition: background 0.18s, border-color 0.18s;
    font-family: inherit;
  }
  /* 仅筛选盘内的 chip：撑满列宽，图标盘随列宽收缩（窄屏不溢出） */
  .cb-list .cb-chip { display: flex; width: 100%; min-width: 0; }
  .cb-list .cb-chip > span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  /* 盟约筛选图标：仿游戏内盟约选择界面（未选中 = 灰边暗底；选中 = 青色发光盘 + 黑色图标） */
  .cb-chip-icwrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 78px;
    height: 78px;
    box-sizing: border-box;
    border-radius: 50%;
    border: 3px solid #3d4a4c;
    background: radial-gradient(circle at 50% 42%, #1a2727 0%, #0b1112 78%);
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .cb-chip img { width: 63px; height: 63px; object-fit: contain; border: none; background: none; filter: grayscale(1) brightness(0.85); transition: filter 0.2s; }
  .cb-list .cb-chip-icwrap { width: min(78px, 100%); height: auto; aspect-ratio: 1 / 1; }
  .cb-list .cb-chip img { width: 80%; height: 80%; }
  .cb-chip:hover .cb-chip-icwrap { border-color: #7d9691; box-shadow: 0 0 12px rgba(74, 235, 181, 0.25); }
  .cb-chip:hover img { filter: grayscale(0.2) brightness(1); }
  .cb-chip:hover span { color: var(--accent-glow); }
  .cb-chip.active .cb-chip-icwrap {
    border-color: #4aebb5;
    background: radial-gradient(circle at 50% 42%, #7dffd9 0%, #2dd6a4 55%, #12916d 100%);
    box-shadow: 0 0 9px rgba(74, 235, 181, 0.95), 0 0 24px rgba(74, 235, 181, 0.55), 0 0 45px rgba(74, 235, 181, 0.28);
  }
  .cb-chip.active img { filter: brightness(0) saturate(0); }
  .cb-chip.active span { color: var(--accent); }
  /* 被禁止的盟约：灰边 → 红色泛光边框 */
  .cb-chip.banned .cb-chip-icwrap {
    border-color: #ff5252;
    background: radial-gradient(circle at 50% 42%, #241818 0%, #0b1112 78%);
    box-shadow: 0 0 9px rgba(255, 82, 82, 0.9), 0 0 24px rgba(255, 82, 82, 0.5), 0 0 42px rgba(255, 82, 82, 0.25);
  }
  .cb-chip.banned img { filter: grayscale(1) brightness(0.9); }
  .cb-chip.banned span { color: #ff8a80; }
  .cb-chip.banned:hover .cb-chip-icwrap { border-color: #ff7875; box-shadow: 0 0 12px rgba(255, 82, 82, 1), 0 0 30px rgba(255, 82, 82, 0.6), 0 0 48px rgba(255, 82, 82, 0.3); }
  /* 被禁 + 已选中：与选中态同构，只把青色换成红色（红盘 + 反相黑图标），点击才有明确反馈 */
  .cb-chip.banned.active .cb-chip-icwrap {
    border-color: #ff8a80;
    background: radial-gradient(circle at 50% 42%, #ffb3a7 0%, #e5484d 55%, #8c1a1a 100%);
    box-shadow: 0 0 9px rgba(255, 82, 82, 1), 0 0 27px rgba(255, 82, 82, 0.65), 0 0 48px rgba(255, 82, 82, 0.32);
  }
  .cb-chip.banned.active img { filter: brightness(0) saturate(0); }
  .cb-chip.banned.active span { color: #ff9b93; }
  /* 角标为纯数字（无气泡底/描边）：仅靠亮色 + 深色投影，任何状态下都清晰 */
  .cb-chip.active .cb-chip-badge { color: #eafff9; }
  .cb-chip.banned .cb-chip-badge { color: #ff7b72; text-shadow: 0 0 7px rgba(0, 0, 0, 1), 0 0 2px rgba(0, 0, 0, 1), 0 1.5px 4px rgba(0, 0, 0, 0.95), 0 0 10px rgba(255, 82, 82, 0.55); }
  .cb-chip.banned.active .cb-chip-badge { color: #ffe6e2; }
  .cov-browse-header { display: flex; align-items: center; gap: 18px; margin-bottom: 21px; padding-bottom: 12px; border-bottom: 1.5px solid var(--border); }
  .cov-browse-header h2 { display: flex; align-items: center; gap: 18px; font-size: 1.24em; margin: 0; color: var(--text); letter-spacing: 0.08em; }

  /* ===== 代理人图鉴（卫戍协议 · 策略卡） ===== */
  .strategy-toolbar { display: flex; flex-direction: column; gap: 9px; margin-bottom: 21px; padding: 15px 18px; background: rgba(25, 30, 27, 0.8); border: 1.5px solid var(--border); border-left: 3px solid var(--accent-dim); border-radius: 0; }
  .strategy-note { font-size: 0.8em; color: var(--text-mute); }
  .strategy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 21px 13.5px; }
  .strategy-card {
    background: none;
    border: none;
    padding: 4.5px 3px;
    cursor: pointer;
    transition: transform 0.18s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    text-align: center;
  }
  .strategy-card:hover { transform: translateY(-1.5px); }
  .strategy-card-avatar {
    width: 132px;
    height: 132px;
    object-fit: cover;
    border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    background: var(--bg-deep);
    transition: border-color 0.18s;
  }
  .strategy-card:hover .strategy-card-avatar { border-color: var(--accent); }
  .strategy-card:hover .strategy-card-name { color: var(--accent-glow); }
  .strategy-card-name { font-size: 0.88em; font-weight: 600; color: var(--text); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color 0.18s; }
  .strategy-hp-badge { display: inline-block; padding: 1.5px 13.5px; border-radius: 3px; background: var(--gold-soft); border: 1.5px solid rgba(230,183,71,0.45); color: var(--gold); font-size: 0.76em; font-weight: 600; }
  .strategy-card-meta { display: flex; gap: 7.5px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .strategy-use-badge { display: inline-block; padding: 1.5px 13.5px; border-radius: 3px; background: var(--accent-soft); border: 1.5px solid var(--accent-dim); color: var(--accent-glow); font-size: 0.76em; font-weight: 600; }
  .strategy-pact-badge { display: inline-block; padding: 1.5px 13.5px; border-radius: 3px; border: 1.5px solid; font-size: 0.76em; font-weight: 600; }
  .strategy-pact-badge.strategy-generic { border-color: var(--border-strong); color: var(--text-mute); background: rgba(137,148,138,0.1); }
  .strategy-dp-avatar { width: 96px; height: 96px; border-radius: 3px; object-fit: cover; border: 1.5px solid var(--border-strong); background: var(--bg-deep); flex-shrink: 0; }

  /* ===== 装备图鉴 ===== */
  .gear-toolbar {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 21px;
    padding: 15px 18px;
    background: rgba(25, 30, 27, 0.8);
    border: 1.5px solid var(--border);
    border-left: 3px solid var(--accent-dim);
    border-radius: 0;
  }
  #gear-search { display: block; width: 100%; margin-bottom: 18px; }
  .gear-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(435px, 1fr)); gap: 15px; }
  .gear-card { background: rgba(31, 39, 35, 0.72); border: 1.5px solid var(--border); border-radius: 3px; padding: 16.5px 19.5px; transition: border-color 0.18s, background 0.18s; }
  .gear-card:hover { border-color: var(--accent-dim); background: rgba(38, 47, 42, 0.9); }
  .gear-card-top { display: flex; gap: 16.5px; align-items: center; margin-bottom: 10.5px; }
  .gear-icon { width: 63px; height: 63px; object-fit: contain; background: var(--bg-deep); border: 1.5px solid var(--border); border-radius: 3px; flex-shrink: 0; }
  .gear-card-info { min-width: 0; }
  .gear-card-name { font-weight: 600; color: var(--text); margin-bottom: 4.5px; font-size: 0.95em; }
  .gear-card-meta { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; font-size: 0.76em; color: var(--text-mute); }
  .gear-card-effect { font-size: 0.8em; color: var(--text-dim); line-height: 1.6; }

  /* ===== 全局布局：主内容 + 右侧详情面板（所有界面统一左右五五开） ===== */
  .app-layout { display: flex; gap: 21px; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  /* 隐藏左侧滚动面板的原生滚动条（位置由顶部阶级导航指示） */
  .app-main { flex: 1 1 50%; min-width: 0; overflow-y: auto; scrollbar-width: none; }
  .app-main::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .detail-panel {
    flex: 1 1 50%;
    min-width: 0;
    background: linear-gradient(170deg, #1a201d 0%, #141917 100%);
    border: 1.5px solid var(--border);
    border-top: 1.5px solid var(--accent-dim);
    border-radius: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
  }
  /* 固定筛选条：随 app-main 滚动时吸附顶部，不跟随内容滚走 */
  .sticky-bar { position: sticky; top: 0; z-index: 30; background: #101311; }
  .tier-tabs { position: sticky; top: 0; z-index: 30; background: #101311; padding: 6px 0 15px; border-bottom: 1.5px solid var(--line); }
  .gear-toolbar { position: sticky; top: 0; z-index: 30; background: #141816; }
  .dp-crumbs {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4.5px;
    padding: 9px 21px;
    background: rgba(16, 19, 17, 0.55);
    border-bottom: 1.5px solid var(--line);
    font-size: 0.76em;
    letter-spacing: 0.05em;
    color: var(--text-mute);
  }
  .dp-crumb {
    padding: 0 4.5px;
    color: var(--text-mute);
    cursor: pointer;
    transition: color 0.2s;
    white-space: nowrap;
  }
  .dp-crumb:hover { color: var(--accent-glow); }
  .dp-crumb.root { color: var(--text-dim); font-weight: 600; }
  .dp-crumb.page { color: var(--text-dim); font-weight: 600; }
  .dp-crumb.cur { color: var(--accent); font-weight: 600; cursor: default; }
  .dp-crumb-sep { color: var(--text-off); opacity: 0.7; }
  .dp-body { overflow-y: auto; padding: 21px 24px 27px; flex: 1 1 auto; min-height: 0; }
  .dp-empty {
    text-align: center;
    padding: 81px 27px;
    color: var(--text-mute);
    font-size: 0.86em;
    letter-spacing: 0.12em;
    line-height: 2.1;
  }
  .dp-empty::before {
    content: '';
    display: block;
    width: 69px;
    height: 1.5px;
    margin: 0 auto 24px;
    background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
  }
  /* 空态在详情区内垂直居中，避免宽屏下文字孤零零贴在顶部 */
  .dp-body:has(> .dp-empty) { display: flex; align-items: center; justify-content: center; }
  .dp-body:has(> .dp-empty) .dp-empty { padding: 0 27px; }

  /* 盟约目录（大号圆圈线框 + 下方名称，一屏放完不滚动）
     圆盘尺寸随视口高度自适应：高屏保持 144px，普通屏自动缩到刚好放满一屏；
     左右留 24px 内边距，让选中/被禁的泛光有完整空间，不被滚动容器裁成一条“墙” */
  .cov-dir-list { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 22px 9px; padding: 0 24px; margin-bottom: 9px; }
  #cov-dir-mech { padding-bottom: 30px; margin-bottom: 0; }
  .cov-dir-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 9px;
    padding: 3px 3px 5px;
    background: none;
    border: none;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .cov-dir-item:hover { transform: translateY(-1.5px); }
  /* 盟约一览：与干员查询筛选同一套设计语言的大号版（圆盘 + 75% 图标） */
  .cov-dir-icon-wrap {
    --cov-disc: clamp(56px, calc((100vh - 600px) / 6), 150px);
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: var(--cov-disc);
    height: var(--cov-disc);
    box-sizing: border-box;
    border-radius: 50%;
    border: 3px solid #3d4a4c;
    background: radial-gradient(circle at 50% 42%, #1a2727 0%, #0b1112 78%);
    line-height: 0;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .cov-dir-icon {
    width: 75%;
    height: 75%;
    object-fit: contain;
    flex-shrink: 0;
    background: none;
    border: none;
    border-radius: 0;
    filter: grayscale(1) brightness(0.85);
    transition: filter 0.2s;
  }
  .cov-dir-item:hover .cov-dir-icon-wrap { border-color: #7d9691; box-shadow: 0 0 15px rgba(74, 235, 181, 0.25); }
  .cov-dir-item:hover .cov-dir-icon { filter: grayscale(0.2) brightness(1); }
  .cov-dir-item:hover .cov-dir-name { color: var(--accent); }
  .cov-dir-name { font-size: 0.9em; font-weight: 600; color: var(--accent-glow); text-align: center; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color 0.2s; }

  /* 装备图鉴（左：正方形网格卡：图标+名称+售价；右：详情面板） */
  .gear-bubbles { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 15px 12px; }
  .gear-bubble {
    background: none;
    border: none;
    border-radius: 3px;
    padding: 6px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7.5px;
  }
  .gear-bubble .gear-bubble-icon {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 3px;
    object-fit: contain;
    background: rgba(16, 19, 17, 0.85);
    border: 1.5px solid var(--border-strong);
    padding: 10.5px;
    transition: border-color 0.2s, background 0.2s, transform 0.2s;
  }
  .gear-bubble:hover .gear-bubble-icon {
    border-color: var(--accent-dim);
    background: rgba(18, 58, 49, 0.35);
    transform: translateY(-3px);
  }
  .gear-bubble-name {
    font-size: 0.88em;
    font-weight: 600;
    color: var(--text);
    line-height: 1.25;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color 0.2s;
  }
  .gear-bubble:hover .gear-bubble-name { color: var(--accent-glow); }
  .gear-coin {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 28.5px;
    height: 28.5px;
    padding: 0 6px;
    border-radius: 3px;
    background: linear-gradient(160deg, #ecd07a 0%, #c99a2e 100%);
    color: #2a1e00;
    font-size: 0.94em;
    font-weight: 900;
    line-height: 1;
    border: 1.5px solid rgba(0, 0, 0, 0.35);
    flex-shrink: 0;
  }
  /* 装备列表：名称 + 价格球同行，价格球在名称左侧 */
  .gear-bubble-name-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    margin-top: 9px;
    max-width: 100%;
  }
  /* 装备详情：阶位/费用文字气泡 + 详情放大 */
  .gear-meta-pill {
    display: inline-flex;
    align-items: center;
    font-size: 0.9em;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 6px 18px;
    border-radius: 3px;
    white-space: nowrap;
    vertical-align: middle;
  }
  .gear-meta-pill.tier {
    color: var(--accent-glow);
    background: var(--accent-soft);
    border: 1.5px solid var(--accent-dim);
  }
  .gear-meta-pill.price {
    color: #2a1e00;
    background: linear-gradient(160deg, #ecd07a 0%, #c99a2e 100%);
    border: 1.5px solid rgba(0, 0, 0, 0.35);
  }
  .gear-detail .gear-icon-lg { width: 144px; height: 144px; border-radius: 3px; border: 1.5px solid var(--border-strong); background: rgba(16, 19, 17, 0.85); }
  .gear-detail h2 { font-size: 1.6em; color: var(--text); letter-spacing: 0.06em; }
  .gear-detail + .dp-sec h4 { font-size: 1.05em; }
  .gear-detail + .dp-sec .dp-text { font-size: 1em; line-height: 1.85; }

  /* 干员详情面板内部 */
  .dp-op-head { display: flex; gap: 21px; align-items: center; margin-bottom: 21px; padding-bottom: 18px; border-bottom: 1.5px solid var(--line); }
  .dp-op-head h2 { font-size: 1.4em; margin-bottom: 9px; color: var(--text); letter-spacing: 0.06em; }
  .dp-op-tags { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 9px; }
  .dp-op-tags .tier-badge[data-tier] { cursor: pointer; transition: transform 0.15s; }
  .dp-op-tags .tier-badge[data-tier]:hover { transform: scale(1.12); filter: brightness(1.25); }
  .dp-op-covs { display: flex; flex-wrap: wrap; gap: 6px; }
  .dp-sec { margin-bottom: 21px; }
  .dp-sec h4 {
    font-size: 0.86em;
    color: var(--text-dim);
    margin-bottom: 9px;
    letter-spacing: 0.12em;
    padding-left: 12px;
    border-left: 3px solid var(--accent-dim);
  }
  .dp-text { font-size: 0.9em; line-height: 1.75; background: rgba(16, 19, 17, 0.6); border: 1.5px solid var(--line); padding: 13.5px 16.5px; border-radius: 3px; color: var(--text-dim); }

  /* 干员特质：普通 / 精锐 分段开关（形状对齐参考项目，配色用本项目青绿 / 金） */
  .dp-sec h4.trait-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .trait-switch {
    display: inline-flex;
    flex-shrink: 0;
    border: 1.5px solid var(--border-strong);
    border-radius: 3px;
    overflow: hidden;
    letter-spacing: 0.04em;
  }
  .trait-switch button {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 1px 13px;
    font-family: inherit;
    font-size: 0.92em;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text-mute);
    cursor: pointer;
    transition: color 0.18s, background 0.18s;
  }
  .trait-switch button + button { border-left: 1.5px solid var(--border-strong); }
  .trait-switch button:hover { color: var(--accent-glow); background: rgba(0, 232, 184, 0.08); }
  .trait-switch button.on { color: #04211a; background: linear-gradient(165deg, var(--accent-glow) 0%, var(--accent) 100%); }
  .trait-switch button.on:hover { color: #04211a; }
  .trait-switch button.on[data-mode="e"] { color: #2a1e00; background: linear-gradient(165deg, #ecd07a 0%, #c99a2e 100%); }
  /* 特质文本：时机标签 + 两档差异数值 */
  .trait-when {
    display: inline-block;
    margin-right: 7px;
    padding: 0 6px;
    font-size: 0.86em;
    line-height: 1.6;
    color: var(--accent-glow);
    background: var(--accent-soft);
    border-radius: 2px;
    vertical-align: 1px;
  }
  .trait-num { font-weight: 700; color: var(--accent-glow); }
  .dp-text.trait-body.elite .trait-num { color: var(--gold); }
  .dp-pos-list { display: flex; flex-direction: column; gap: 9px; }
  .dp-pos-card {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 12px 16.5px;
    background: rgba(16, 19, 17, 0.6);
    border: 1.5px solid var(--border);
    border-left: 3px solid var(--border-strong);
    border-radius: 0;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .dp-pos-card:hover { border-color: var(--border-strong); border-left-color: var(--accent-dim); background: rgba(36, 44, 39, 0.6); }
  .dp-pos-cov { font-weight: bold; color: var(--accent-glow); padding: 3px 12px; background: rgba(18, 58, 49, 0.85); border: 1.5px solid rgba(22, 141, 115, 0.5); border-radius: 3px; font-size: 0.82em; }
  .dp-pos-badge { font-size: 0.82em; }
  .dp-pos-role { color: var(--text-mute); font-size: 0.78em; }
  .dp-guide-btn {
    margin-top: 18px;
    padding: 12px 24px;
    background: rgba(18, 58, 49, 0.55);
    border: 1.5px solid var(--accent-dim);
    border-radius: 3px;
    color: var(--accent-glow);
    cursor: pointer;
    font-size: 0.86em;
    letter-spacing: 0.06em;
    font-family: inherit;
    transition: background 0.2s, border-color 0.2s;
  }
  .dp-guide-btn:hover { background: rgba(18, 58, 49, 0.95); border-color: var(--accent); }
  .covenant-type-tag {
    display: inline-block;
    margin: 12px 0 9px;
    padding: 3px 15px;
    border-radius: 3px;
    font-size: 0.78em;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .covenant-type-tag.core { color: var(--accent-glow); background: var(--accent-soft); border: 1.5px solid var(--accent-dim); }
  .covenant-type-tag.attach { color: var(--text-dim); background: rgba(137, 148, 138, 0.1); border: 1.5px solid var(--border-strong); }
  .gear-icon-lg { width: 108px; height: 108px; object-fit: contain; background: rgba(16, 19, 17, 0.85); border: 1.5px solid var(--border); border-radius: 3px; flex-shrink: 0; }
  #ops-tbody .op-row { cursor: pointer; }
  #ops-tbody .op-row:hover { background: var(--bg-hover); }

  /* ===== 左侧列表选中态（点击显示信息+高亮；再点取消，右侧面板变空白） =====
     选中态 = 图标/头像底色填充浅绿色（区别于悬停的边框发光） */
  .op-bubble.selected .op-bubble-avatar-box,
  .gear-bubble.selected .gear-bubble-icon {
    border-color: var(--accent);
    background: rgba(18, 58, 49, 0.9);
  }
  .op-bubble.selected .op-bubble-name,
  .gear-bubble.selected .gear-bubble-name { color: var(--accent-glow); }
  .cov-dir-item.selected .cov-dir-icon-wrap {
    border-color: #4aebb5;
    background: radial-gradient(circle at 50% 42%, #7dffd9 0%, #2dd6a4 55%, #12916d 100%);
    box-shadow: 0 0 10.5px rgba(74, 235, 181, 0.95), 0 0 24px rgba(74, 235, 181, 0.55);
  }
  .cov-dir-item.selected .cov-dir-icon { filter: brightness(0) saturate(0); }
  .cov-dir-item.selected .cov-dir-name { color: var(--accent); }
  .enemy-leader-card.selected .enemy-leader-avatar {
    border-color: var(--accent);
    background: rgba(18, 58, 49, 0.9);
  }
  .enemy-leader-card.selected .enemy-leader-name { color: var(--accent); }
  .enemy-train-card.selected {
    border-color: var(--accent-dim);
    background: rgba(18, 58, 49, 0.35);
  }
  .enemy-train-card.selected .enemy-train-card-name { color: var(--accent); }
  .strategy-card.selected .strategy-card-avatar {
    border-color: var(--accent);
    background: rgba(18, 58, 49, 0.9);
  }
  .strategy-card.selected .strategy-card-name { color: var(--accent); }
  .guide-card.selected { border-color: var(--accent-dim); background: rgba(18, 58, 49, 0.28); }
  /* 被 Ban 且被选中时，仍保持红色语义 */
  .guide-card.banned.selected { border-color: #ff5252; background: rgba(80, 44, 44, 0.88); }
  .op-row.selected,
  .op-row.selected:hover { background: rgba(0, 232, 184, 0.09); }

  /* 关系图（SVG 内嵌） */
  .relchart { margin-top: 12px; background: rgba(16, 19, 17, 0.72); border: 1.5px solid var(--border); border-left: 3px solid var(--accent-dim); border-radius: 0; padding: 15px 18px 18px; }
  .relchart svg { display: block; width: 100%; max-width: 780px; height: auto; margin: 0 auto; }
  .relchart-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
  .relchart-top .relchart-title { margin-bottom: 0; }
  .relchart-title { font-size: 0.78em; color: var(--text-mute); margin-bottom: 9px; letter-spacing: 0.08em; display: flex; align-items: center; gap: 9px; }
  .relchart-legend { font-size: 0.7em; color: var(--text-mute); margin-top: 12px; display: flex; gap: 27px; flex-wrap: wrap; }
  .rel-lg { display: inline-flex; align-items: center; gap: 10.5px; }
  .rel-lg i { display: inline-block; width: 30px; height: 3px; }
  .relchart-notes { font-size: 0.68em; color: var(--text-off); margin-top: 9px; line-height: 1.7; }
  .relchart-notes b { color: var(--text-mute); font-weight: 400; }
  .relchart-node-cov { cursor: pointer; }
  .relchart-node-cov circle { transition: stroke 0.15s, stroke-width 0.15s; }
  .relchart-node-cov:hover text { fill: var(--gold); }
  .relchart-node-cov:hover > circle:first-of-type { stroke: var(--gold); stroke-width: 2; }
  /* 连接图内的干员名框：整框可含多行，逐行独立悬停高亮 / 点击 */
  .graph-op-row { cursor: pointer; }
  .graph-op-row-bg { transition: fill 0.15s; }
  .graph-op-row:hover .graph-op-row-bg { fill: rgba(0, 232, 184, 0.2); }
  .graph-op-row:hover text { fill: #eafff9; }

  @media (max-width: 768px) {
    /* 移动端保持原有观感：重置基准字号，不随桌面 1.5x 放大 */
    body { font-size: 14.5px; }
    .app-layout { flex-direction: column; }
    .app-main { flex: 1 1 auto; }
    .detail-panel { position: static; flex: 1 1 auto; width: 100%; max-height: none; }
    .container { padding: 8px 10px 10px; }
    header h1 { font-size: 1.3em; }
    .tabs { overflow-x: auto; }
    .tab { padding: 7px 12px; font-size: 0.82em; }
    table { font-size: 0.8em; }
    thead th, tbody td { padding: 6px 5px; }
    .cb-list { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .oq-switches { grid-column: 1 / -1; }
    .cov-dir-list { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 5px; }
    .cov-dir-icon-wrap { --cov-disc: clamp(46px, 14vw, 72px); }
    .strategy-grid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px 7px; }
    .strategy-card-avatar { width: 66px; height: 66px; }
    .enemy-leader-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px 10px; }
    .enemy-train-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    /* 移动端顶部阶级按钮条换行为两行更高，加大滚动落点偏移避免遮挡 */
    .tier-list, .guide-group { scroll-margin-top: 130px; }
    .covenant-header { flex-direction: column; gap: 15px; }
    /* 移动端标题改为块级，避免图标 / 标题 / 徽标挤在一行把标题压成竖排 */
    .cov-h2 { display: block; }
    .cov-h2 .cov-icon-lg { width: 38px; height: 38px; margin-right: 10px; vertical-align: -9px; }
    .cov-h2 .cov-need-badge { margin-left: 10px; vertical-align: 2px; }
    .cov-only-ops { max-width: 100%; align-items: flex-start; }
    .cov-only-rows { align-items: flex-start; }
    .cov-only-row { justify-content: flex-start; }
    .relchart-top { flex-direction: column; gap: 7px; }
  }

  /* ===== Ban 位（档案库入口按钮 + 弹窗 + 干员查询标记） ===== */
  .ban-btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin-left: auto;
    align-self: center;
    padding: 10.5px 21px;
    background: rgba(239, 107, 98, 0.1);
    border: 1.5px solid rgba(239, 107, 98, 0.55);
    color: var(--red);
    border-radius: 3px;
    font-size: 19.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, border-color 0.2s;
  }
  .ban-btn:hover { background: rgba(239, 107, 98, 0.2); border-color: var(--red); }
  .ban-btn .ban-count {
    display: none;
    background: var(--red);
    color: #1a0908;
    border-radius: 3px;
    font-size: 0.78em;
    min-width: 25.5px;
    height: 25.5px;
    line-height: 25.5px;
    text-align: center;
    padding: 0 7.5px;
    font-weight: 700;
  }
  .ban-btn.has-ban .ban-count { display: inline-block; }

  .ban-overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 9, 7, 0.78);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s, visibility 0.2s;
  }
  .ban-overlay.open { opacity: 1; visibility: visible; }
  .ban-modal {
    width: min(1230px, calc(100vw - 60px));
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    background: linear-gradient(170deg, #1a201d 0%, #121715 100%);
    border: 1.5px solid var(--border-strong);
    border-top: 3px solid var(--accent-dim);
    border-radius: 0;
    padding: 27px 30px;
    box-shadow: 0 27px 72px rgba(0, 0, 0, 0.65);
  }
  .ban-modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 6px;
  }
  .ban-modal-head h3 { margin: 0; font-size: 1.05em; color: var(--text); letter-spacing: 0.12em; }
  .ban-close {
    background: none;
    border: none;
    color: var(--text-mute);
    font-size: 1.3em;
    line-height: 1;
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 3px;
    transition: color 0.2s, background 0.2s;
    font-family: inherit;
  }
  .ban-close:hover { color: var(--red); background: rgba(239, 107, 98, 0.12); }
  .ban-modal-note { font-size: 0.78em; color: var(--text-mute); margin-bottom: 15px; letter-spacing: 0.04em; }
  .ban-sec-title {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 0.76em;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    margin: 18px 0 12px;
    white-space: nowrap;
  }
  .ban-sec-title::after { content: ''; flex: 1; height: 1.5px; background: var(--line); }
  .ban-list { display: flex; flex-wrap: wrap; gap: 12px 9px; }
  /* Ban 位设置：直接复用干员查询的圆形盟约筛选 chip（banned = 红色泛光边框），右上角常显剩余可用干员数 */
  .ban-modal-foot {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 18px;
    margin-top: 27px;
    padding-top: 19.5px;
    border-top: 1.5px solid var(--line);
    flex-wrap: wrap;
  }
  .ban-switch { position: relative; width: 57px; height: 27px; flex-shrink: 0; }
  .ban-switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .ban-switch .track {
    position: absolute;
    inset: 0;
    background: #1c221e;
    border: 1.5px solid var(--border-strong);
    border-radius: 3px;
    transition: background 0.2s, border-color 0.2s;
  }
  .ban-switch .track::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    background: var(--text-mute);
    border-radius: 1.5px;
    transition: transform 0.2s, background 0.2s;
  }
  .ban-switch input:checked + .track { background: var(--accent-soft); border-color: var(--accent-dim); }
  .ban-switch input:checked + .track::after { transform: translateX(30px); background: var(--accent); }
  .ban-reset-btn {
    padding: 12px 22.5px;
    background: rgba(239, 107, 98, 0.1);
    border: 1.5px solid rgba(239, 107, 98, 0.55);
    color: var(--red);
    border-radius: 3px;
    font-size: 0.86em;
    font-weight: 600;
    letter-spacing: 0.06em;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, border-color 0.2s;
  }
  .ban-reset-btn:hover { background: rgba(239, 107, 98, 0.2); border-color: var(--red); }
  .ban-reset-btn:disabled { opacity: 0.45; cursor: default; }

  /* 干员查询：盟约图标角标 + 被 Ban 干员（灰头像 / 红框 / 选中淡红） */
  .cb-chip { position: relative; }
  .cb-chip-icwrap { position: relative; display: inline-flex; }
  .cb-chip-badge {
    position: absolute;
    top: -13px;
    right: -9px;
    font-size: 1.2em;
    font-weight: 900;
    line-height: 1;
    color: var(--accent-glow);
    text-shadow: 0 0 7px rgba(0, 0, 0, 1), 0 0 2px rgba(0, 0, 0, 1), 0 1.5px 4px rgba(0, 0, 0, 0.95);
    pointer-events: none;
  }
  .op-bubble.banned .op-bubble-avatar-box {
    border-color: var(--red);
  }
  .op-bubble.banned .op-bubble-avatar {
    filter: grayscale(1);
  }
  .op-bubble.banned:hover .op-bubble-avatar-box {
    border-color: #f78d84;
  }
  .op-bubble.banned .op-bubble-name { color: var(--text-mute); }
  .op-bubble.banned.selected .op-bubble-avatar-box {
    background: rgba(239, 107, 98, 0.18);
    border-color: var(--red);
  }

  /* 盟约一览：被禁阵营红色泛光边框（与选中态同构，只换色）/ 选中+被禁 = 红盘反相 */
  .cov-dir-item.banned .cov-dir-icon-wrap {
    border-color: #ff5252;
    background: radial-gradient(circle at 50% 42%, #241818 0%, #0b1112 78%);
    box-shadow: 0 0 10.5px rgba(255, 82, 82, 0.9), 0 0 24px rgba(255, 82, 82, 0.5);
  }
  .cov-dir-item.banned .cov-dir-icon { filter: grayscale(1) brightness(0.9); }
  .cov-dir-item.banned:hover .cov-dir-icon-wrap {
    border-color: #ff7875;
    box-shadow: 0 0 12px rgba(255, 82, 82, 1), 0 0 27px rgba(255, 82, 82, 0.6);
  }
  .cov-dir-item.banned.selected .cov-dir-icon-wrap {
    border-color: #ff8a80;
    background: radial-gradient(circle at 50% 42%, #ffb3a7 0%, #e5484d 55%, #8c1a1a 100%);
    box-shadow: 0 0 10.5px rgba(255, 82, 82, 1), 0 0 24px rgba(255, 82, 82, 0.62);
  }
  .cov-dir-item.banned.selected .cov-dir-icon { filter: brightness(0) saturate(0); }

  /* 干员详情：被 ban 头像红框 + 红字提示 */
  .op-detail-avatar-box {
    display: inline-block;
    position: relative;
    line-height: 0;
    border-radius: 50%;
    border: 3px solid var(--accent-dim);
    background: var(--bg-deep);
    flex-shrink: 0;
  }
  .op-detail-avatar-box .avatar-xlg {
    border: none;
    box-shadow: none;
  }
  .op-detail-avatar-box.banned {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(255, 82, 82, 0.16);
  }
  .op-detail-avatar-box.banned .avatar-xlg {
    filter: grayscale(1) brightness(0.9);
  }
  /* 红色蒙版：头像整体压成红色调，与标题旁红字提示呼应 */
  .op-detail-avatar-box.banned::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(255, 82, 82, 0.42);
    mix-blend-mode: multiply;
    pointer-events: none;
  }
  .op-banned-note {
    color: var(--red);
    font-size: 0.86em;
    font-weight: 700;
    margin-top: 7.5px;
    letter-spacing: 0.06em;
  }

  /* 代理人：被禁阵营专属代理人灰头像 + 红框 */
  .strategy-avatar-box {
    border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    background: var(--bg-deep);
    overflow: hidden;
    display: inline-block;
    line-height: 0;
    transition: border-color 0.2s;
  }
  .strategy-avatar-box .strategy-card-avatar {
    border: none;
    background: none;
  }
  .strategy-card.banned .strategy-avatar-box {
    border-color: var(--red);
  }
  .strategy-card.banned .strategy-card-avatar {
    filter: grayscale(1);
  }
  .strategy-card.banned .strategy-card-name { color: var(--text-dim); }
  .strategy-dp-box {
    display: inline-block;
    line-height: 0;
    border-radius: 3px;
    border: 1.5px solid var(--border-strong);
    background: var(--bg-deep);
    flex-shrink: 0;
  }
  .strategy-dp-box .strategy-dp-avatar {
    border: none;
  }
  .strategy-dp-box.banned {
    border-color: var(--red);
  }
  .strategy-dp-box.banned .strategy-dp-avatar {
    filter: grayscale(1);
  }
  .strategy-banned-note {
    color: var(--red);
    font-size: 0.9em;
    font-weight: 700;
    margin-top: 9px;
    letter-spacing: 0.45px;
  }
</style>
</head>
<body>
<header>
  <h1>卫戍协议：规程 数据库</h1>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" data-tab="covenant">盟约一览</button>
    <button class="tab" data-tab="op-query">干员查询</button>
    <button class="tab" data-tab="guide">攻略</button>
    <button class="tab" data-tab="enemy">敌人图鉴</button>
    <button class="tab" data-tab="gear">装备图鉴</button>

const covOptions = document.getElementById('cov-options');

Object.keys(covenants).sort().forEach(name => {
  const label = document.createElement('label');
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.value = name;
  cb.className = 'cov-cb';
  cb.addEventListener('change', updateCovToggleLabel);
  label.appendChild(cb);
  label.appendChild(document.createTextNode(name));

function getSelectedCovenants() {
  return Array.from(document.querySelectorAll('.cov-cb:checked')).map(cb => cb.value);
}

function updateCovToggleLabel() {
  const sel = getSelectedCovenants();
  if (sel.length === 0) {
    covToggle.textContent = '全部盟约';
  } else if (sel.length === 1) {
    covToggle.textContent = sel[0];
  } else {
    covToggle.innerHTML = '已选 ' + sel.length + ' 个盟约<span class="ms-count">' + sel.length + '</span>';
  }

// Tabs —— 顶部标签点击=路径从头计算；仅浮窗内点击才累积路径
const ROOT_NAMES = {
  covenant: '盟约一览', 'op-query': '干员查询',
  guide: '攻略', enemy: '敌人图鉴', gear: '装备图鉴',
  strategy: '代理人图鉴', all: '档案库'
};
function currentTab() {
  return document.querySelector('.tab.active')?.dataset.tab || 'covenant';
}
// 某一栏在目录里的标识名（攻略栏与当前攻略盟约合并成「攻略 · 盟约」，不再拆两级）
function crumbPageLabel(t) {
  if (t === 'guide') return '攻略 · ' + guideCov;
  return ROOT_NAMES[t] || t;
}
// mode: 'reset'（顶部标签点击，路径从头计算）/ 'preserve'（浮窗内跨界面跳转，保留整条路径）
// opt.label：跨栏跳转时该栏标识的自定义文案；opt.silent：回退路径时静默切换，不追加标识
function switchTab(t, mode, opt) {
  const prev = currentTab();
  const o = opt || {};
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector('.tab[data-tab="' + t + '"]').classList.add('active');
  document.getElementById('tab-' + t).classList.add('active');
  if (mode !== 'preserve') {
    crumbRoot = { label: crumbPageLabel(t), tab: t };
    crumbTrail = [];
    selType = null; selKey = null;
  } else if (!o.silent && t !== prev) {
    // 跨栏跳转：在该栏留下一个标识（只有打开详情页才会跳转，所以标识与详情页一一对应）
    crumbTrail.push({ kind: 'page', tab: t, label: o.label || crumbPageLabel(t) });
  }
  if (t === 'covenant') renderCovDir();
  if (t === 'op-query') renderOpQueryView();
  if (t === 'guide') renderGuideView();
  if (t === 'enemy') renderEnemyView();
  if (t === 'gear') renderGearView();
  if (t === 'strategy') renderStrategyView();
  if (t === 'all') renderTable();
  renderDetailPanel();
}
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => switchTab(tab.dataset.tab, 'reset'));
});

// Table view - state
let currentPage = 1;
const pageSize = 25;
let sortField = 'tier';
let sortAsc = true;
let filteredOps = [...operators];

function applyFilters() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const selectedCovs = getSelectedCovenants();
  const logic = document.getElementById('filter-logic').value;
  const tierFilter = document.getElementById('filter-tier').value;
  filteredOps = operators.filter(op => {
    const opCovs = op.盟约.split('、').map(s => s.trim());
    if (selectedCovs.length > 0) {
      const hit = logic === 'and'
        ? selectedCovs.every(c => opCovs.includes(c))
        : selectedCovs.some(c => opCovs.includes(c));
      if (!hit) return false;
    }
    if (tierFilter && op.阶 !== tierFilter) return false;
    if (search) {
      const text = (op.干员 + ' ' + op.盟约 + ' ' + op.技能 + ' ' + op.特质).toLowerCase();
      if (!text.includes(search)) return false;
    }
    return true;
  });
  sortOps();
  currentPage = 1;
  renderTable();
}

function sortOps() {
  filteredOps.sort((a, b) => {
    let va, vb;
    if (sortField === 'tier') { va = parseInt(a.阶); vb = parseInt(b.阶); }
    else if (sortField === 'op') { va = a.干员; vb = b.干员; }
    else if (sortField === 'covenant') { va = a.盟约; vb = b.盟约; }
    else if (sortField === 'skill') { va = a.技能; vb = b.技能; }
    else { va = a.特质; vb = b.特质; }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });
}

function renderTable() {
  const tbody = document.getElementById('ops-tbody');
  const start = (currentPage - 1) * pageSize;
  const pageOps = filteredOps.slice(start, start + pageSize);
  tbody.innerHTML = pageOps.map(op => {
    const covenants = op.盟约.split('、').map(c =>
      `<span class="covenant-tag" data-cov="${c}" ${covStyle(c)}>${c}</span>`
    ).join('');
    return `<tr class="op-row" data-name="${op.干员}" data-seltype="op" data-selkey="${op.干员}">
      <td><div class="op-cell">${avatarHtml(op.干员)}<span class="op-name">${op.干员}</span></div></td>
      <td>${covenants}</td>
      <td><span class="skill-type">${op.技能}</span></td>
      <td><span class="tier-badge ${tierColors[op.阶]}">${tierRoman[op.阶]}</span></td>

      showDetail('cov', tag.dataset.cov, true);

}

function renderPagination() {
  const total = Math.ceil(filteredOps.length / pageSize);
  const pag = document.getElementById('pagination');
  if (total <= 1) { pag.innerHTML = ''; return; }
  let html = '';
  html += `<button class="page-btn" ${currentPage===1?'disabled style="opacity:0.4"':''} onclick="goPage(${currentPage-1})">上一页</button>`;
  for (let i = 1; i <= total; i++) {
    if (i === 1 || i === total || Math.abs(i - currentPage) <= 2) {
      html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    } else if (Math.abs(i - currentPage) === 3) {
      html += `<span style="padding:9px;color:var(--text-dim)">...</span>`;
    }
  }
  html += `<button class="page-btn" ${currentPage===total?'disabled style="opacity:0.4"':''} onclick="goPage(${currentPage+1})">下一页</button>`;
  pag.innerHTML = html;
}
window.goPage = function(p) { currentPage = p; renderTable(); };

// ===== 右侧详情面板（文件管理器式路径：根标签 → 界面子页 → 详情项） =====
// 路径段：{ kind:'tab'|'page'|'item', label, tab, type?, key? }
//   tab  = 进入某个界面的分层（如「攻略」）
//   page = 界面内部的子页（如「攻略 › 乌萨斯」）
//   item = 具体详情（盟约 / 干员 / 装备 / 敌人 / 策略）
let crumbRoot = { label: '盟约一览', tab: 'covenant' };
let crumbTrail = [];
function crumbSep() { return '<span class="dp-crumb-sep">›</span>'; }
// 攻略是「攻略 + 当前盟约」合并成的一个顶层界面：路径以它本身为根，不再拆成两级
function resetGuideTrail() {
  crumbRoot = { label: '攻略 · ' + guideCov, tab: 'guide' };
  crumbTrail = [];
}
// 同一界面里的平行点击 → 回到该界面的页面基座
function resetCrumbForCurrentTab() {
  if (currentTab() === 'guide') { resetGuideTrail(); return; }
  crumbRoot = { label: ROOT_NAMES[currentTab()] || crumbRoot.label, tab: currentTab() };
  crumbTrail = [];
}
function detailLabel(type, key) {
  if (type === 'cov') return '【' + key + '】盟约';
  if (type === 'op') return '干员：' + key;
  if (type === 'gear') return '装备：' + key;
  if (type === 'enemy') return key.indexOf('T:') === 0 ? '敌方分组：' + key.slice(2) : '敌人：' + key.replace(/^L:/, '');
  if (type === 'strategy') return '策略：' + key;
  return key;
}
function showDetail(type, key, drill) {
  const tab = currentTab();
  const seg = { kind: 'item', type, key, label: detailLabel(type, key), tab };
  if (!drill) {
    // 左侧列表点击 → 从当前界面的基座重新开始
    resetCrumbForCurrentTab();
    crumbTrail = [seg];
  } else {
    const last = crumbTrail[crumbTrail.length - 1];
    // 同一栏同一列表里换项 → 只替换末段；跨栏 / 换类型一律追加，保留完整路径
    if (last && last.kind === 'item' && last.type === type && last.tab === tab) {
      crumbTrail[crumbTrail.length - 1] = seg;
    } else {
      crumbTrail.push(seg);
    }
  }
  renderDetailPanel();
}
function renderDetailPanel() {
  const crumbs = document.getElementById('dp-crumbs');
  const body = document.getElementById('dp-body');
  const last = crumbTrail[crumbTrail.length - 1];
  const cur = last && last.kind === 'item' ? last : null;
  let c = `<span class="dp-crumb root" data-i="-1">${crumbRoot.label}</span>`;
  crumbTrail.forEach((seg, i) => {
    const cls = 'dp-crumb' + (seg.kind === 'page' ? ' page' : '') + (i === crumbTrail.length - 1 ? ' cur' : '');
    c += crumbSep() + `<span class="${cls}" data-i="${i}">${seg.label}</span>`;
  });
  crumbs.innerHTML = c;
  crumbs.querySelectorAll('.dp-crumb[data-i]').forEach(el => {
    el.addEventListener('click', () => {
      const i = parseInt(el.dataset.i);
      if (i < 0) {
        if (currentTab() !== crumbRoot.tab) switchTab(crumbRoot.tab, 'preserve', { silent: true });
        // 攻略根节点本身就是「攻略 · 盟约」页，不需要再补子页
        crumbTrail = [];
        renderDetailPanel();
        return;
      }
      const seg = crumbTrail[i];
      if (currentTab() !== seg.tab) switchTab(seg.tab, 'preserve', { silent: true });
      crumbTrail = crumbTrail.slice(0, i + 1);
      renderDetailPanel();
    });
  });
  if (!cur) {
    body.innerHTML = `<div class="dp-empty">在左侧选择盟约 / 干员 / 装备 / 敌人 / 策略<br>此处将显示详细信息。</div>`;
    selType = null; selKey = null;
    syncSelection();
    return;
  }
  selType = cur.type; selKey = cur.key;
  if (cur.type === 'cov') body.innerHTML = covenantDetailHtml(cur.key);
  if (cur.type === 'op') body.innerHTML = opDetailHtml(cur.key);
  if (cur.type === 'gear') body.innerHTML = gearDetailHtml(cur.key);
  if (cur.type === 'enemy') body.innerHTML = enemyDetailHtml(cur.key);
  if (cur.type === 'strategy') body.innerHTML = strategyDetailHtml(cur.key);
  bindDetailEvents(body);
  syncSelection();
}

// ===== 全视图选中态：点击左侧项 → 右侧显示信息 + 该项高亮；再点同一项 → 取消选中，右侧面板变空白 =====
let selType = null; // 当前选中项类型：cov / op / gear / enemy / strategy
let selKey = null;  // 当前选中项 key
function toggleSelect(type, key) {
  if (selType === type && selKey === key) {
    // 再次点击同一项 → 取消选中，回到该界面的页面基座
    resetCrumbForCurrentTab();
    selType = null; selKey = null;
    renderDetailPanel();
  } else {
    selType = type; selKey = key;
    showDetail(type, key);
  }
  syncSelection();
}
function syncSelection() {
  document.querySelectorAll('[data-seltype]').forEach(el => {
    el.classList.toggle('selected', selType !== null && el.dataset.seltype === selType && el.dataset.selkey === selKey);

}
// 连接图 / 仅属于标签点击 → 跳转到「干员查询」，同时把干员追加到现有路径末尾
function gotoOpQuery(name) {
  if (currentTab() !== 'op-query') switchTab('op-query', 'preserve');

  const bubble = [...document.querySelectorAll('#op-query-view .op-bubble')].find(b => b.dataset.name === name);

// ===== 干员特质（普通 / 精锐 两档） =====
function escTraitHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
// 把 <时机> 渲染成小标签；两档之间数值不同的数字单独高亮
function traitTextHtml(name, mode) {
  const t = OP_TRAIT[name];
  const op = operators.find(o => o.干员 === name);
  if (!t) {
    return escTraitHtml(op ? op.特质 : '').replace(/&lt;([^&]+)&gt;/g, '<span class="trait-when">$1</span>');
  }
  const cur = mode === 'e' ? t.e : t.n;
  const other = mode === 'e' ? t.n : t.e;
  const NUM = /(\d+(?:\.\d+)?)/;
  const a = cur.split(NUM), b = other.split(NUM);
  let raw = cur;
  if (a.length === b.length && a.every((x, i) => i % 2 || x === b[i])) {
    raw = a.map((x, i) => (i % 2 === 0 || x === b[i]) ? x : '\u0000' + x + '\u0001').join('');
  }
  return escTraitHtml(raw)
    .replace(/&lt;([^&]+)&gt;/g, '<span class="trait-when">$1</span>')
    .replace(/\u0000([^\u0001]*)\u0001/g, '<span class="trait-num">$1</span>');
}
function traitSectionHtml(name) {
  const t = OP_TRAIT[name];
  const hasElite = !!t && t.e !== t.n;
  const sw = hasElite
    ? `<span class="trait-switch" role="group" aria-label="特质等级"><button type="button" class="on" data-mode="n">普通</button><button type="button" data-mode="e">精锐</button></span>`
    : '';
  return `<div class="dp-sec"><h4 class="trait-head">特质${sw}</h4><div class="dp-text trait-body" data-trait-op="${name}">${traitTextHtml(name, 'n')}</div></div>`;
}

// ===== SVG 关系图生成器（大盟约连接图 / 小盟约关系图） =====
// 小盟约配色（对齐参考图：精准=绿、迅捷=灰蓝、灵巧=紫、坚守=蓝、不屈=红、奥术=橙、突袭=青、聚合=玫红）
const GRAPH_COV_COLORS = {
  '精准': '#1f9e63', '迅捷': '#5a6b7c', '灵巧': '#8b5cc7', '坚守': '#2f6fd0',
  '不屈': '#d9534f', '奥术': '#d9862b', '突袭': '#2aa5b8', '聚合': '#c0457c',
  '奇迹': '#c9a227', '远见': '#4c8c8c', '助力': '#7a8f3d', '协防干员': '#6e5b8a',
  '投资人': '#a8622e', '独行': '#4a5a66', '调和': '#8a6a9c'
};
const GRAPH_GRAY = '#7d8f86';
function graphCovColor(c) { return GRAPH_COV_COLORS[c] || '#3f6b5e'; }
function graphOpLabel(op) { return op.name + '·' + (tierRoman[op.tier] || op.tier); }
// 估算文字宽度（中日韩字符 ≈ 1em，其余 ≈ 0.55em）
function graphTextW(str, fs) {
  let w = 0;
  for (const ch of str) w += /[\u2e80-\u9fff\u2160-\u217f\uf900-\ufaff\uff00-\uffef]/.test(ch) ? fs : fs * 0.55;
  return w;
}
// 连线上的参数点：直线取线性插值，弧线取二次贝塞尔
function graphPathPoint(p1, p2, ctrl, t) {
  if (ctrl) {
    const u = 1 - t;
    return {
      x: u * u * p1.x + 2 * u * t * ctrl.x + t * t * p2.x,
      y: u * u * p1.y + 2 * u * t * ctrl.y + t * t * p2.y
    };
  }
  return { x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t };
}
// 干员框尺寸（框尽量小，1 行高 24，2 行高 40）
function graphBoxMetrics(rows) {
  return {
    w: Math.max(...rows.map(r => graphTextW(r, 10.5))) + 14,
    h: rows.length * 16 + 8
  };
}

    s += graphNodeSVG(c, pos[c].x, pos[c].y, NODE_R, false, ghost, ghost ? null : covBanState(c));

  s += '</svg>';

  const legend = [
    { color: GRAPH_BLUE, text: '大盟约干员 → 小盟约' },
    { color: GRAPH_GRAY, text: '同时拥有两个小盟约的干员' }
  ];
  if (focusOps.some(o => o.banned)) legend.push({ color: GRAPH_RED, text: '红色：被 Ban 干员所在的线与框' });
  if (banCovs.has(focus) || GRAPH_CORE_RING.some(c => banCovs.has(c))) {
    legend.push({ color: GRAPH_RED, text: '红边盟约：已被禁止（暗红=仍有可用干员，深暗红=相连干员全被 Ban）' });
  }
  if (linked.length < GRAPH_CORE_RING.length) {
    legend.push({ color: 'rgba(255,255,255,0.28)', text: '淡显：本盟约暂无该小盟约干员（被禁止也不标红）' });

function buildCovGraph(focus) {
