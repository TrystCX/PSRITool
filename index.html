、冻结免疫、浮空免疫、沉睡免疫\n普通攻击命中目标后，攻击结束时进入消化模式并强制触发技能【消化】\n根据关卡配置，登场时可进入消化模式并强制触发技能【登场消化】\n被击倒的干员再部署时间归零但在消化完成前无法再部署，召唤物则进入再部署时间\n※被吞噬的干员的卡片顶部会带有特殊的红黑色吞噬标志；完成消化时进入再部署时间"}]},"高准度伦蒂尼姆城防自行炮":{"id":"LUD2","w":4,"desc":"伦蒂尼姆的城防武器之一，拥有极大攻击范围的同时，精准度也大幅度提升。规模巨大，由伦蒂尼姆的工人们在工厂中组装而成。","r":["沉默"],"lv":[{"n":0,"hp":"18000","atk":"750","def":"1500","res":"10","spd":"0.5","int":"6.0","aspd":"100","eres":"0","dres":"0","c":"远程","a":"地面","tal":""}]},"破城者":{"id":"JTJ07","w":4,"desc":"乌萨斯第一军工厂研发的战争机器，代表着乌萨斯最先进的武器技术，由于破城者能耗巨大，一般只在极其重要的战役中使用。","r":["沉默"],"lv":[{"n":0,"hp":"25000","atk":"800","def":"1300","res":"20","spd":"0.5","int":"3.5","aspd":"100","eres":"0","dres":"0","c":"远程","a":"地面","tal":"占用3个阻挡数\n被阻挡时使用不同攻击，不会攻击飞行单位\n可以与3名<矿工游击队>交战"}]},"伊利昂的木驮兽":{"id":"MIN10","w":6,"desc":"米诺斯公民们扮演的伊利昂的木驮兽。传说在城邦林立的时代，雅赛努斯人在木驮兽里装载士兵，从内部击败了久攻不破的伊利昂城。这个故事家喻户晓，只要看到一群米诺斯人挤在一辆载具上，大家都知道他们在演的是什么，甚至会想主动加入其中。","r":[],"lv":[{"n":0,"hp":"28000","atk":"100","def":"600","res":"10","spd":"1.0","int":"5.0","aspd":"100","eres":"0","dres":"0","c":"不攻击","a":"地面","tal":"无法攻击/被阻挡\n载客：载客上限5，载客半径0.5，载客条件为“非领袖且非机械类的地面敌人类敌方单位”，卸客区域为以伊利昂的木驮兽为中心的0.4边长正方形范围；卸客时将乘客的路径替换为自身的剩余路径\n自身每装载有1名乘客，移动速度-20%（移动速度存在0.1数值下限）\n※已载客数量不低于2名/5名时，自身模型分别进行一次变化（表现形式为载具上出现更多的木驮兽扮演者）"}]},"拥霜羽兽":{"id":"KL08","w":3,"desc":"谢拉格本土特有的羽兽。受到降临在圣山上的神秘物质的影响，获得了更好的视力和嗅觉，可也变得更有攻击性。它怀中抱着的无法孵化的蛋变成的冰岩，可以轻松地刨开泥土挖掘果实，也可以用来狠狠地敲击敌人的脑袋。","r":[],"lv":[{"n":0,"hp":"10000","atk":"400","def":"200","res":"20","spd":"0.7","int":"3.5","aspd":"100","eres":"0","dres":"0","c":"远程","a":"地面","tal":"不会攻击飞行单位\n退出失衡状态后，每0.1秒尝试强制触发技能【失去蛋】"}]},"异质裂兽·α":{"id":"KD04","w":3,"desc":"盘踞在矿井深处的变异野兽，地底的活物越来越少，饥饿至发狂的野兽在岩壁上划出了一道道爪印，黑色的矿石顺着血迹生长，直到爬上野兽消瘦的身躯。它们的身躯再次变得庞大而可怖。","r":[],"lv":[{"n":0,"hp":"27500","atk":"1250","def":"100","res":"20","spd":"0.5","int":"3.0","aspd":"100","eres":"0","dres":"0","c":"近战","a":"地面","tal":"被阻挡时使用不同攻击，未被阻挡时仅攻击范围内的乌萨斯平民/斗士塔露拉/矿工游击队（不可对空）\n\n出场时获得最大生命值5%的特殊屏障（仅吸收来源于矿工游击队的物理伤害），该屏障存在期间：\n①嘲讽等级+1，攻击速度+100，恐惧免疫、沉睡免疫\n②受到的无来源或来源非矿工游击队的物理/法术伤害-50%\n\n可以与3名<矿工游击队>交战"}]},"心虚设计师":{"id":"WW07","w":4,"desc":"不能按时交稿的设计师。很是心虚，他发现自己不小心误入了镜头，立刻仓皇地逃走。","r":["沉默"],"lv":[{"n":0,"hp":"10000","atk":"400","def":"450","res":"30","spd":"0.5","int":"1.0","aspd":"100","eres":"0","dres":"0","c":"不攻击","a":"地面","tal":"具有左右面向机制\n左右面向为左向时（【心虚】时改为右向），受到来自左侧的物理/法术伤害-80%\n左右面向为右向时（【心虚】时改为左向），受到来自右侧的物理/法术伤害-80%\n若自身位于摄影区域，且当前移动方向正前方180°范围内存在激活的摄像机的情况下，临时进入【心虚】状态：调换减伤效果的左右面向条件（自身会采用反向移动的动画）\n被阻挡时，使阻挡自身的单位受到【设计师的深意】影响：每秒受到心虚设计师攻击力15%的神经损伤（同名效果不叠加）"}]},"转译基底·α":{"id":"OG17","w":1,"desc":"在未知区域Abyss中诞生的未知个体，未受到特定伤害的情况下不会展现出任何侵略行为。但它……好像在学习我们的行动模式？","r":[],"lv":[{"n":0,"hp":"2500","atk":"100","def":"450","res":"40","spd":"1.0","int":"1.0","aspd":"100","eres":"0","dres":"10","c":"不攻击","a":"地面","tal":"原始形态<初始形态>\n不进行攻击，受到伤害时取消此伤害\n失衡免疫，免疫晕眩/沉睡/寒冷/冻结/浮空/恐惧\n根据特定条件，将会变化为不同的形态，其属性与天赋也会相应变化：\n①受到第4次物理伤害时：变化为寻仇者形态；\n②受到第4次法术伤害时：变化为特战术师形态；\n③被阻挡时：变化为幽灵形态\n※仅可变化一次\n变化过程持续2s\n\n寻仇者形态\n最大生命值+4000，攻击力+500，防御力+250，法术抗性+20，移动速度-0.55，攻击间隔+1.3，重量等级+1\n仅进行近战攻击，造成物理伤害；生命值低于50%时，攻击力+100%\n特战术师形态\n最大生命值+2000，攻击力+300，防御力+200，法术抗性+30，移动速度-0.4，攻击间隔+3.0，重量等级+1\n仅进行远程攻击，同时攻击2个目标，造成法术伤害\n幽灵形态\n无属性变化；无法被阻挡"}]},"聆风猎手":{"id":"BF2","w":2,"desc":"生活在黑流树海中的活跃“居民”。他们狂热地练习着一种追踪敌人的狩猎技巧，这似乎是因为他们的村落曾被侵略者用漫天的炮火犁成一片片废墟，直到他们中有一名刺客大师领悟了这门技艺。","r":[],"lv":[{"n":0,"hp":"15000","atk":"600","def":"300","res":"20","spd":"0.7","int":"1.2","aspd":"100","eres":"0","dres":"0","c":"远程","a":"地面","tal":"普通攻击造成近战途径伤害，不会攻击飞行单位\n在未被阻挡、且不具有闪现冷却的情况下，受到伤害时，若可以找到伤害来源，且伤害来源周围x-4存在未来可达地块（包括目标本格，优先选择直线距离自身所在地块最近＞行列顺序（行先）的地块），则以该单位为目标强制触发技能【追猎】\n\n※未来可达地块：即“自身的路径终点与这个地块之间‘可达’”的、非保护目标点的、非自身所在格的、且自身可通行的地块；该地块可能与自己当前位置/下一路径点之间不可达"}]},"枯朽萃聚使徒":{"id":"NAC16","w":5,"desc":"蕴藏了食腐者之王源石技艺的有机造物，可以萃取战场上驳杂的死亡精华来创造枯朽之种。","r":["眩晕","沉默","沉睡","冻结","浮空"],"lv":[{"n":0,"hp":"30000","atk":"500","def":"250","res":"30","spd":"0.3","int":"5.0","aspd":"100","eres":"0","dres":"0","c":"不攻击","a":"飞行","tal":"静态刚体，不进行普通攻击"}]},"沏虹":{"id":"AN18","w":2,"desc":"受岁相感染而生的器伥。酒添水愈淡，茶添水愈浓，此类器伥可麻痹敌人的神经从而降低敌人攻速，且不知疲倦，愈战愈勇。","r":[],"lv":[{"n":0,"hp":"8750","atk":"360","def":"380","res":"50","spd":"0.8","int":"3.5","aspd":"100","eres":"0","dres":"0","c":"远程","a":"地面","tal":"普通攻击对目标对及目标周围半径1.0范围内的所有我方单位造成法术普通伤害（无视迷彩，不可对空）\n死亡爆炸（爆炸半径1.25，造成攻击力100%法术溅射伤害并施加15s【烹泉减益】，无视迷彩，不可对空）\n【烹泉减益】：攻击速度-50，且固定每3秒额外-0（可被抵抗，可叠加，每层持续时间和效果独立计算）\n因坠落以外的原因死亡后0.7s内的随机时间在以自身为中心1.0边长正方形范围内随机位置以自身路径召唤4个彩瓷茶器"}]},"新硎":{"id":"AN26","w":3,"desc":"受岁相感染而生的器伥。兵戈旧梦今又来，此类器伥记忆复苏，仿佛重回战场，彼此间一呼百应，战力倍增。","r":[],"lv":[{"n":0,"hp":"14000","atk":"1350","def":"750","res":"30","spd":"1.3","int":"2.2","aspd":"100","eres":"0","dres":"0","c":"近战","a":"地面","tal":"攻击力+80%，持有4个【断刃】\n每次成功攻击后消耗1个【断刃】，攻击结束时若已耗尽【断刃】，则立刻切换为无断刃模式并失去攻击力加成\n因坠落以外的原因死亡后0.7s内的随机时间在以自身为中心1.0边长正方形范围内随机位置以自身路径召唤自身剩余【断刃】数量的铁矛头（至少召唤1个）\n\n初始模式：无额外天赋或能力\n无断刃模式：无额外天赋或能力"}]},"异光体孽生者":{"id":"SM45","w":2,"desc":"在恶劣环境中成长的独立个体，已经发育成为合成神经毒素的腺体，极度罕见，极度危险。","r":["沉默"],"lv":[{"n":0,"hp":"33000","atk":"600","def":"0","res":"80","spd":"0.25","int":"3.0","aspd":"100","eres":"0","dres":"0","c":"近战","a":"地面","tal":"初始处于【待命】状态：不进行普通攻击\n受到伤害时/被赘生甲壳阻挡时进入【临战】状态：\n①移动速度+400%，进入该状态时若处于停驻检查点，跳过该停驻检查点；半径2.5范围内的所有我方单位受到【孽生者的神经毒素】效果影响：每秒受到异光体孽生者攻击力10%的神经损伤（光环，同名效果不叠加）\n②赘生甲壳进入自身半径0.5范围内时，自身受到最大生命值25%的真实伤害，成功造成伤害后强制击杀该赘生甲壳"}]},"家族暗影灭迹人":{"id":"SA14","w":3,"desc":"忠于家族的顶尖杀手，暗影是他的仆从，杀戮比覆手更轻易。令家族立足与兴盛的秘闻之中都有他的身影，得见他真容的人都已长眠于地下。","r":[],"lv":[{"n":0,"hp":"18000","atk":"1050","def":"800","res":"45","spd":"0.9","int":"3.0","aspd":"100","eres":"0","dres":"0","c":"远程","a":"地面","tal":"隐匿（解除阻挡1秒后恢复），不会攻击飞行单位\n“清算时刻”持续期间，自身攻击力+15%，防御力+15%，攻击速度+50"}]},"愤怒的守墓石像":{"id":"GGY2","w":4,"desc":"深池部队中的特殊法术造物。创造者为头领蔓德拉。据蔓德拉所说，她在郊外的坟墓里学习源石技艺，守墓石像是最初的同伴。石像外形有过多次更迭，最新造型仿自某支血脉古老的萨卡兹。这款石像饱含着蔓德拉对维多利亚的怒火。","r":[],"lv":[{"n":0,"hp":"12000","atk":"750","def":"750","res":"0","spd":"0.5","int":"4.0","aspd":"100","eres":"0","dres":"0","c":"近战 远程","a":"地面","tal":"折射\n\n地面模式<初始模式>\n仅进行阻挡攻击，造成近战途径物理伤害\n受到足以致命的伤害时，若该伤害来源于破碎支柱，则不进行下述重生\n首次被击倒时进行持续一瞬间的重生（回复100%生命值），重生结束后切换至石像模式\n\n石像模式\n防御力+800、法术抗性+30，自缚、失衡免疫、不可阻挡、浮空免疫，无法攻击/被阻挡\n10秒后进入飞行模式\n\n飞行模式\n变为飞行单位，失衡免疫、浮空免疫\n普通攻击造成远程途径法术伤害，不会攻击飞行单位"}]},"雪孩子":{"id":"KL01","w":1,"desc":"在谢拉格人迹罕至的雪原中蹦蹦跳跳的小东西，性格冒失，容易磕碰。一旦到了春天，就会从雪白变成灰扑扑的样子，并长出茂盛的绒毛。","r":[],"lv":[{"n":0,"hp":"5500","atk":"200","def":"200","res":"10","spd":"0.6","int":"5.0","aspd":"100","eres":"0","dres":"0","c":"近战","a":"地面","tal":"与高地碰撞时若自身处于失衡状态，对自身造成5000真实伤害，随后的5秒内不会再次触发上述伤害"}]},"新手祭司学徒":{"id":"MIN04","w":1,"desc":"新加入芙罗拉神殿的祭司学徒。传说芙罗拉是掌握了无数鲜花与植物的知识，能将之应用在源石技艺中的英雄。除学习、清扫、送货、报信、焚香等神殿学徒的常规工作外，他们还要承担维护街上缀花喷泉的工作。","r":[],"lv":[{"n":0,"hp":"4000","atk":"300","def":"100","res":"20","spd":"0.5","int":"5.0","aspd":"100","eres":"0","dres":"0","c":"近战","a":"地面","tal":"死亡爆炸（爆炸半径1.2，治疗范围内的所有敌方单位相当于自身攻击力500%的生命值，同时治疗范围内仇恨最高的1个喷泉水池3000生命值，无论其生命值是否已满）"}]},"冒失的小弟":{"id":"HI03","w":3,"desc":"金石会的普通成员。一旦摔倒，他们便会陷入深沉的自我怀疑，暂时抛弃战斗思考人生。所以一直在当小弟。","r":[],"lv":[{"n":0,"hp":"5000","atk":"500","def":"80","res":"0","spd":"0.7","int":"5.0","aspd":"100","eres":"0","dres":"0","c":"近战","a":"地面","tal":"退出失衡状态时晕眩3秒"}]},"赏金猎人“骑士”":{"id":"SMN7","w":3,"desc":"精通巫术的赏金猎人，自制装备时参考了卡西米尔骑士的造型。在执行任务时，他们通过追猎来折磨任务目标，获得乐趣。","r":["沉默"],"lv":[{"n":0,"hp":"9000","atk":"400","def":"200","res":"60","spd":"0.25","int":"4.0","aspd":"100","eres":"0","dres":"0","c":"近战","a":"地面","tal":"未处于被阻挡、眩晕、束缚状态时每0.5秒尝试一次加速，每次提升50%移动速度。最多尝试25次\n被阻挡后首次攻击时，额外造成一次当前移动速度×550的法术普通伤害，同时清空移速叠加并重置加速尝试次数\n※眩晕，束缚，接触稳固锁链会清空移速叠加并重置加速尝试次数"}]},"水遁忍者":{"id":"HI11","w":2,"desc":"能原地转很长时间的忍者，坚称自己转起来周身就是有水，只是旁边的人视力太差看不到。除非在旋转时绊他一跤，否则不会停止。","r":[],"lv":[{"n":0,"hp":"10000","atk":"600","def":"500","res":"20","spd":"0.7","int":"1.5","aspd":"100","eres":"0","dres":"0","c":"近战","a":"地面","tal":"可以弹开“某种天命”（详细机制请看该页面）\n\n初始形态\n仅进行阻挡攻击；进入该形态后的1s内无法切换至漩涡形态\n漩涡形态\n不进行普通攻击，每秒对半径1.0范围内的所有我方单位造成攻击力120%的近战途径物理伤害（无视迷彩，不可对空），自身受阻止攻击类异常效果影响期间无法造成此伤害；进入该形态后的1s内无法切换至初始形态\n失衡移动结束时或经过60s后切换至初始形态"}]},"自制投石机":{"id":"MIN16","w":4,"desc":"米诺斯公民自制的投石机。制作材料是普通的纸板，因此威力有限。因为放了太多石头，把机器推到地方得花费大量力气，这导致投石手在实际投掷时，常会因为劳累手抖而失去准头。","r":[],"lv":[{"n":0,"hp":"16000","atk":"750","def":"800","res":"0","spd":"0.6","int":"7.0","aspd":"100","eres":"0","dres":"0","c":"远程","a":"地面","tal":"普通攻击为3连击，向目标发射石块对目标半径1.5范围内的所有我方单位造成物理普通伤害（此弹道不会强制击中主目标，碰撞无视迷彩），索敌不受阻挡影响，且不会因丢失目标而结束攻击\n自身持有入戏(敌方)时，普通攻击改为向目标边长6.0正方形区域内的随机位置发射伤害半径改为0.5的石块"}]},"炫目刀技厨师":{"id":"TO17","w":0,"desc":"和蔼可亲的女士，带着妈妈的妈妈传给她的装备而来，想为这次的庆典再增添一些温情。\n曾经的切胡萝卜大赛全国冠军。看着她炫目的刀法，大家不敢不多分一个冰淇淋给她。","r":[],"lv":[{"n":0,"hp":"18000","atk":"600","def":"500","res":"20","spd":"0.8","int":"4.0","aspd":"100","eres":"0","dres":"0","c":"近战","a":"地面","tal":"半径2.5范围内的所有敌方单位防御力+0，法术抗性+25，攻击速度+50（可叠加，不可对空，无视目标可选性）"}]},"临时收音师":{"id":"WW01","w":1,"desc":"临时从蓝卡坞移动拍摄地块上找来的工作人员。第一次进入剧组，他很努力地想要完成自己的工作，但不知为什么设备总是无法成功收音？","r":["沉默"],"lv":[{"n":0,"hp":"4000","atk":"350","def":"150","res":"15","spd":"0.9","int":"2.0","aspd":"100","eres":"0","dres":"0","c":"近战","a":"地面","tal":"位于摄影区域范围外时，攻击附加20%攻击力的神经损伤"}]},"迷茫的修理小助手":{"id":"OG1","w":1,"desc":"被源石干扰了寻路模块的修理小助手，连工程部干员特意添加的送餐功能都很难实现了。“你说维护功能？我们的工程师够多了。至于华法琳提出的食品安全警告，我们正在努力改进。”","r":[],"lv":[{"n":0,"hp":"2000","atk":"300","def":"200","res":"25","spd":"1.9","int":"2.0","aspd":"100","eres":"0","dres":"0","c":"近战","a":"地面","tal":""}]},"高能源石虫":{"id":"B6","w":0,"desc":"野生的被感染生物，腹部已经被大量源石同化，且处于不稳定状态，死亡时可能出现爆炸。这种低智能生物极有可能会被敌方术师操纵，以进入人工设施内发动集群攻击。","r":[],"lv":[{"n":0,"hp":"2460","atk":"260","def":"0","res":"0","spd":"1.0","int":"1.7","aspd":"100","eres":"0","dres":"0","c":"近战","a":"地面","tal":"死亡爆炸（爆炸半径1.25，延迟1秒，爆炸时来源无效，造成攻击力400%的无途径物理溅射伤害，无视迷彩，不可对空）"}]},"圣堂剑士":{"id":"MT9","w":1,"desc":"为确保降生仪式顺利进行而遴选的育婴圣堂巡卫，负责常规的地面巡逻工作。他们战斗经验不算丰富，经常被保育员叫去帮忙清洁巨型奶瓶。","r":[],"lv":[{"n":0,"hp":"6000","atk":"400","def":"350","res":"0","spd":"1.2","int":"1.3","aspd":"100","eres":"0","dres":"0","c":"近战","a":"地面","tal":"显示自身的技力条（对应剩余弹药数量）\n每6s尝试触发一次【赐我力量！】，最多成功触发10次\n自身移动速度最终提升至(100%+增益层数×20%)，自身攻击力+(增益层数×20%)"}]},"寻仇者":{"id":"14","w":2,"desc":"使用特殊攻击手段的作战人员，身份不明。使用了一种特制的武器进行攻击，并且在交战中会习惯于更换作战手法，变得更加难以抵挡。","r":[],"lv":[{"n":0,"hp":"5000","atk":"300","def":"200","res":"50","spd":"0.65","int":"2.3","aspd":"100","eres":"0","dres":"0","c":"近战","a":"地面","tal":"生命值不高于50%时，攻击力+100%"},{"n": 鳞":{"id":"PI7","w":0,"desc":"繁殖期会频繁跃出盐层的雌性飞鳞，它会在空中短暂地滑翔，并散播清香的信息素。若在出航时遇到一头栽倒在甲板上的它，船员们便会将之视作吉兆。","r":[],"lv":[{"n":0,"hp":"10000","atk":"100","def":"0","res":"10","spd":"0.6","int":"1.0","aspd":"100","eres":"0","dres":"0","c":"不攻击","a":"地面","tal":"近地悬浮，不进行普通攻击\n受晕眩/无法行动/沉睡/缚地影响后进入晕眩模式（若由搬运模式进入，则在自身所在地块中心以自身路径召唤1名寻险水手），期间近地悬浮暂时失效，离开上述异常效果影响后进入初始模式\n受到冻结影响时获得【失温坠落】：冻结结束时，获得0.05秒晕眩 \n首次受到伤害后的5秒内移动速度最终提升至300%（不会在晕眩模式下触发，自身切换模式时解除此天赋给予的移速增益）\n根据关卡配置，初始可进入搬运模式（可查看该敌人模型下方是否存在“水手木桶”以确认其是否处于搬运模式）\n\n初始模式：失衡免疫\n搬运模式：失衡免疫；退场时，在自身所在地块中心以自身路径召唤1名寻险水手；每0.3秒检测一次，已到抵达数第n个路径点（取决于关卡配置，为0时无法触发技能）、且自身离所在地块中心的距离＜0.4时，强制触发技能(受制约)【“丢下去！”】\n晕眩模式：无法被阻挡，进入此模式时获得8秒晕眩"}]},"咸鳞汁推荐者":{"id":"PI5","w":3,"desc":"船员们有时候会互相推荐自己喜欢的事物，咸鳞汁也在其列。只不过，有些船员推荐咸鳞汁的方式太过直接——他们喜欢把桶子直接滚到对方脸上。","r":[],"lv":[{"n":0,"hp":"9000","atk":"850","def":"500","res":"20","spd":"0.5","int":"3.0","aspd":"100","eres":"0","dres":"0","c":"近战","a":"地面","tal":"出场时携带酒桶：不攻击，移动速度最终提升至300%；被阻挡后失去酒桶，上述效果失效\n【免费品尝】区域：半径2的圆形区域，持续时间内使区域内的敌方单位（碰撞判定，无视孤立，不可对空）攻击速度+100、并获得80%物理闪避（同名效果不叠加）"}]},"反派阵营角色":{"id":"WW11","w":3,"desc":"影片中反派阵营的角色。“永远不会认输”是角色的信条，为了让头领获得最终的胜利，它会与主角阵营战斗到最后一刻。","r":["沉默"],"lv":[{"n":0,"hp":"15000","atk":"480","def":"450","res":"60","spd":"0.65","int":"5.0","aspd":"100","eres":"0","dres":"0","c":"远程","a":"地面","tal":"攻击附加攻击力15%的神经损伤，不会攻击飞行单位；计算伤害时若目标为主角阵营角色/命定的主角，攻击倍率提高至500%\n每0.2秒检测一次，若自身未处于消失状态：\n位于摄影区域内时进入演出模式，否则进入初始模式\n\n演出模式\n普通攻击索敌不受阻挡影响，攻击变为二连击，优先攻击主角阵营角色/命定的主角＞阻挡自身的单位＞其他我方单位，可以攻击飞行的主角阵营角色/命定的主角\n此模式下自身将持续尝试触发技能【入戏】（仅能成功触发1次）"}]},"“独轮车玩具”":{"id":"GS17","w":2,"desc":"一种独轮驱动的宝石构装体。在它还愿意待在展台的时候，人们以为它只是一个给孩子们取乐用的杂耍玩具。","r":[],"lv":[{"n":0,"hp":"7500","atk":"450","def":"280","res":"50","spd":"0.7","int":"4.5","aspd":"100","eres":"0","dres":"0","c":"远程","a":"地面","tal":"可以同时攻击2个目标，可以攻击飞行单位，被阻挡时使用不同攻击\n每0.1秒检测一次，位于结晶所在地块时，切换至强化形态；否则切换回普通形态\n强化形态：可以攻击到全场范围内的目标"}]},"无胄盟清扫小队":{"id":"NL12","w":2,"desc":"罗伊亲自培养的清扫小队。但大部分时候罗伊并不带队，队伍内部采取了某种赏金机制，所以积极性很高，攻击造成侵蚀损伤。","r":[],"lv":[{"n":0,"hp":"6500","atk":"700","def":"200","res":"40","s // Tabs —— 顶部标签点击=路径从头计算；仅浮窗内点击才累积路径
const ROOT_NAMES = {
  covenant: '盟约一览', 'op-query': '干员查询',
  guide: '攻略', enemy: '对局信息', gear: '装备图鉴',
  strategy: '代理人图鉴', all: '档案库'
};
function currentTab() {
  return document.querySelector('.tab.active')?.dataset.tab || 'covenant';
}
// 某一栏在目录里的标识名（攻略栏与当前攻略盟约合并成「攻略 · 盟约」，不再拆两级）
function crumbPageLabel(t) {
  if (t === 'guide') return '攻略 · ' + guideCov;
  return ROOT_NAMES[t] || t;
}
// mode: 'reset'（顶部标签点击，路径从头计算）/ 'preserve'（浮窗内跨界面跳转，保留整条路径）
// opt.label：跨栏跳转时该栏标识的自定义文案；opt.silent：回退路径时静默切换，不追加标识
function switchTab(t, mode, opt) {
  const prev = currentTab();
  const o = opt || {};
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector('.tab[data-tab="' + t + '"]').classList.add('active');
  document.getElementById('tab-' + t).classList.add('active');
  if (mode !== 'preserve') {
    crumbRoot = { label: crumbPageLabel(t), tab: t };
    crumbTrail = [];
    selType = null; selKey = null;
  } else if (!o.silent && t !== prev) {
    // 跨栏跳转：在该栏留下一个标识（只有打开详情页才会跳转，所以标识与详情页一一对应）
    crumbTrail.push({ kind: 'page', tab: t, label: o.label || crumbPageLabel(t) });
  }
  if (t === 'covenant') renderCovDir();
  if (t === 'op-query') renderOpQueryView();
  if (t === 'guide') renderGuideView();
  if (t === 'enemy') renderEnemyView();
  if (t === 'gear') renderGearView();
  if (t === 'strategy') renderStrategyView();
  if (t === 'all') renderTable();
  renderDetailPanel();
  // 从顶部进入干员查询时，若已有盟约筛选，右侧直接还原对应盟约详情
  if (t === 'op-query' && mode !== 'preserve') syncOpQueryCovDetail();
}
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => switchTab(tab.dataset.tab, 'reset'));
});

// Table view - state
let currentPage = 1;
const pageSize = 25;
let sortField = 'tier';
let sortAsc = true;
let filteredOps = [...operators];

function applyFilters() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const selectedCovs = getSelectedCovenants();
  const logic = document.getElementById('filter-logic').value;
  const tierFilter = document.getElementById('filter-tier').value;
  filteredOps = operators.filter(op => {
    const opCovs = op.盟约.split('、').map(s => s.trim());
    if (selectedCovs.length > 0) {
      const hit = logic === 'and'
        ? selectedCovs.every(c => opCovs.includes(c))
        : selectedCovs.some(c => opCovs.includes(c));
      if (!hit) return false;
    }
    if (tierFilter && op.阶 !== tierFilter) return false;
    if (search) {
      const text = (op.干员 + ' ' + op.盟约 + ' ' + op.技能 + ' ' + op.特质).toLowerCase();
      if (!text.includes(search)) return false;
    }
    return true;
  });
  sortOps();
  currentPage = 1;
  renderTable();
}

function sortOps() {
  filteredOps.sort((a, b) => {
    let va, vb;
    if (sortField === 'tier') { va = parseInt(a.阶); vb = parseInt(b.阶); }
    else if (sortField === 'op') { va = a.干员; vb = b.干员; }
    else if (sortField === 'covenant') { va = a.盟约; vb = b.盟约; }
    else if (sortField === 'skill') { va = a.技能; vb = b.技能; }
    else { va = a.特质; vb = b.特质; }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });
}

function renderTable() {
  const tbody = document.getElementById('ops-tbody');
  const start = (currentPage - 1) * pageSize;
  const pageOps = filteredOps.slice(start, start + pageSize);
  tbody.innerHTML = pageOps.map(op => {
    const covenants = op.盟约.split('、').map(c =>
      `<span class="covenant-tag" data-cov="${c}" ${covStyle(c)}>${c}</span>`
    ).join('');
    return `<tr class="op-row" data-name="${op.干员}" data-seltype="op" data-selkey="${op.干员}">
      <td><div class="op-cell">${avatarHtml(op.干员)}<span class="op-name">${op.干员}</span></div></td>
      <td>${covenants}</td>
      <td><span class="skill-type">${op.技能}</span></td>
      <td><span class="tier-badge ${tierColors[op.阶]}">${tierRoman[op.阶]}</span></td>
      <td class="trait-text">${op.特质}</td>
    </tr>`;
  }).join('');
  // 干员行点击 → 右侧详情面板（选中/取消）
  tbody.querySelectorAll('.op-row').forEach(row => {
    row.addEventListener('click', () => toggleSelect('op', row.dataset.name));
  });
  // Covenant tag click（档案库 → 直接跳转盟约一览界面，右侧显示盟约，路径从「盟约一览」开始）
  tbody.querySelectorAll('.covenant-tag').forEach(tag => {
    tag.addEventListener('click', (e) => {
      e.stopPropagation();
      switchTab('covenant', 'preserve', { silent: true });
      crumbRoot = { label: '盟约一览', tab: 'covenant' };
      crumbTrail = [];
      selType = 'cov'; selKey = tag.dataset.cov;
      showDetail('cov', tag.dataset.cov, true);
    });
  });
  renderPagination();
  syncSelection();
}

function renderPagination() {
  const total = Math.ceil(filteredOps.length / pageSize);
  const pag = document.getElementById('pagination');
  if (total <= 1) { pag.innerHTML = ''; return; }
  let html = '';
  html += `<button class="page-btn" ${currentPage===1?'disabled style="opacity:0.4"':''} onclick="goPage(${currentPage-1})">上一页</button>`;
  for (let i = 1; i <= total; i++) {
    if (i === 1 || i === total || Math.abs(i - currentPage) <= 2) {
      html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    } else if (Math.abs(i - currentPage) === 3) {
      html += `<span style="padding:9px;color:var(--text-dim)">...</span>`;
    }
  }
  html += `<button class="page-btn" ${currentPage===total?'disabled style="opacity:0.4"':''} onclick="goPage(${currentPage+1})">下一页</button>`;
  pag.innerHTML = html;
}
window.goPage = function(p) { currentPage = p; renderTable(); };

// ===== 右侧详情面板（文件管理器式路径：根标签 → 界面子页 → 详情项） =====
// 路径段：{ kind:'tab'|'page'|'item', label, tab, type?, key? }
//   tab  = 进入某个界面的分层（如「攻略」）
//   page = 界面内部的子页（如「攻略 › 乌萨斯」）
//   item = 具体详情（盟约 / 干员 / 装备 / 敌人 / 策略）
let crumbRoot = { label: '盟约一览', tab: 'covenant' };
let crumbTrail = [];
function crumbSep() { return '<span class="dp-crumb-sep">›</span>'; }
// 攻略是「攻略 + 当前盟约」合并成的一个顶层界面：路径以它本身为根，不再拆成两级
function resetGuideTrail() {
  crumbRoot = { label: '攻略 · ' + guideCov, tab: 'guide' };
  crumbTrail = [];
}
// 同一界面里的平行点击 → 回到该界面的页面基座
function resetCrumbForCurrentTab() {
  if (currentTab() === 'guide') { resetGuideTrail(); return; }
  crumbRoot = { label: ROOT_NAMES[currentTab()] || crumbRoot.label, tab: currentTab() };
  crumbTrail = [];
}
function detailLabel(type, key) {
  if (type === 'cov') return '【' + key + '】盟约';
  if (type === 'op') return '干员：' + key;
  if (type === 'gear') return '装备：' + key;
  if (type === 'enemy') {
    if (key.indexOf('T:') === 0) return '敌方分组：' + key.slice(2);
    if (key.indexOf('E:') === 0) return '敌人：' + key.slice(2);
    if (key.indexOf('J:') === 0) return '联合增益：' + key.slice(2);
    if (key.indexOf('M:') === 0) {
      const r = MUTATION_DATA.rotation[+key.slice(2)];
      return '悬赏：' + (r ? r.base : key.slice(2));
    }
    return '敌人：' + key.replace(/^L:/, '');
  }
  if (type === 'strategy') return '策略：' + key;
  return key;
}
function showDetail(type, key, drill) {
  const tab = currentTab();
  const seg = { kind: 'item', type, key, label: detailLabel(type, key), tab };
  if (!drill) {
    // 左侧列表点击 → 从当前界面的基座重新开始
    resetCrumbForCurrentTab();
    crumbTrail = [seg];
  } else {
    const last = crumbTrail[crumbTrail.length - 1];
    // 同一栏同一列表里换项 → 只替换末段；跨栏 / 换类型一律追加，保留完整路径
    if (last && last.kind === 'item' && last.type === type && last.tab === tab) {
      crumbTrail[crumbTrail.length - 1] = seg;
    } else {
      crumbTrail.push(seg);
    }
  }
  renderDetailPanel();
}
function renderDetailPanel() {
  const crumbs = document.getElementById('dp-crumbs');
  const body = document.getElementById('dp-body');
  const last = crumbTrail[crumbTrail.length - 1];
  const cur = last && last.kind === 'item' ? last : null;
  let c = `<span class="dp-crumb root" data-i="-1">${crumbRoot.label}</span>`;
  crumbTrail.forEach((seg, i) => {
    const cls = 'dp-crumb' + (seg.kind === 'page' ? ' page' : '') + (i === crumbTrail.length - 1 ? ' cur' : '');
    c += crumbSep() + `<span class="${cls}" data-i="${i}">${seg.label}</span>`;
  });
  crumbs.innerHTML = c;
  crumbs.querySelectorAll('.dp-crumb[data-i]').forEach(el => {
    el.addEventListener('click', () => {
      const i = parseInt(el.dataset.i);
      if (i < 0) {
        if (currentTab() !== crumbRoot.tab) switchTab(crumbRoot.tab, 'preserve', { silent: true });
        // 攻略根节点本身就是「攻略 · 盟约」页，不需要再补子页
        crumbTrail = [];
        renderDetailPanel();
        return;
      }
      const seg = crumbTrail[i];
      if (currentTab() !== seg.tab) switchTab(seg.tab, 'preserve', { silent: true });
      crumbTrail = crumbTrail.slice(0, i + 1);
      renderDetailPanel();
    });
  });
  if (!cur) {
    body.innerHTML = `<div class="dp-empty">在左侧选择盟约 / 干员 / 装备 / 敌人 / 策略<br>此处将显示详细信息。</div>`;
    selType = null; selKey = null;
    syncSelection();
    return;
  }
  selType = cur.type; selKey = cur.key;
  if (cur.type === 'cov') body.innerHTML = covenantDetailHtml(cur.key);
  if (cur.type === 'op') body.innerHTML = opDetailHtml(cur.key);
  if (cur.type === 'gear') body.innerHTML = gearDetailHtml(cur.key);
  if (cur.type === 'enemy') body.innerHTML = enemyDetailHtml(cur.key);
  if (cur.type === 'strategy') body.innerHTML = strategyDetailHtml(cur.key);
  bindDetailEvents(body);
  syncSelection();
}

// ===== 全视图选中态：点击左侧项 → 右侧显示信息 + 该项高亮；再点同一项 → 取消选中，右侧面板变空白 =====
let selType = null; // 当前选中项类型：cov / op / gear / enemy / strategy
let selKey = null;  // 当前选中项 key
function toggleSelect(type, key) {
  if (selType === type && selKey === key) {
    // 再次点击同一项 → 取消选中，回到该界面的页面基座
    resetCrumbForCurrentTab();
    selType = null; selKey = null;
    renderDetailPanel();
    // 干员查询里取消干员选中后，回落到当前盟约筛选对应的详情
    if (currentTab() === 'op-query') syncOpQueryCovDetail();
  } else {
    selType = type; selKey = key;
    showDetail(type, key);
  }
  syncSelection();
}
function syncSelection() {
  document.querySelectorAll('[data-seltype]').forEach(el => {
    el.classList.toggle('selected', selType !== null && el.dataset.seltype === selType && el.dataset.selkey === selKey);
  });
}
// 连接图 / 仅属于标签点击 → 跳转到「干员查询」，同时把干员追加到现有路径末尾
function gotoOpQuery(name) {
  if (currentTab() !== 'op-query') switchTab('op-query', 'preserve');
  selType = 'op'; selKey = name;
  showDetail('op', name, true);
  syncSelection();
  const bubble = [...document.querySelectorAll('#op-query-view .op-bubble')].find(b => b.dataset.name === name);
  if (bubble) bubble.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function covenantGuideHtml(name) {

  cat.分组.forEach(group => {

      .map(n => GUIDE_DATA.items.find(i => i.干员 === n && i.盟约 === name) || GUIDE_DATA.items.find(i => i.干员 === n))

// ===== 干员特质（普通 / 精锐 两档） =====
function escTraitHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
// 把 <时机> 渲染成小标签；两档之间数值不同的数字单独高亮
function traitTextHtml(name, mode) {
  const t = OP_TRAIT[name];
  const op = operators.find(o => o.干员 === name);
  if (!t) {
    return escTraitHtml(op ? op.特质 : '').replace(/&lt;([^&]+)&gt;/g, '<span class="trait-when">$1</span>');
  }
  const cur = mode === 'e' ? t.e : t.n;
  const other = mode === 'e' ? t.n : t.e;
  const NUM = /(\d+(?:\.\d+)?)/;
  const a = cur.split(NUM), b = other.split(NUM);
  let raw = cur;
  if (a.length === b.length && a.every((x, i) => i % 2 || x === b[i])) {
    raw = a.map((x, i) => (i % 2 === 0 || x === b[i]) ? x : '\u0000' + x + '\u0001').join('');
  }
  return escTraitHtml(raw)
    .replace(/&lt;([^&]+)&gt;/g, '<span class="trait-when">$1</span>')
    .replace(/\u0000([^\u0001]*)\u0001/g, '<span class="trait-num">$1</span>');
}
function traitSectionHtml(name) {
  const t = OP_TRAIT[name];
  const hasElite = !!t && t.e !== t.n;
  const sw = hasElite
    ? `<span class="trait-switch" role="group" aria-label="特质等级"><button type="button" class="on" data-mode="n">普通</button><button type="button" data-mode="e">精锐</button></span>`
    : '';
  return `<div class="dp-sec"><h4 class="trait-head">特质${sw}</h4><div class="dp-text trait-body" data-trait-op="${name}">${traitTextHtml(name, 'n')}</div></div>`;
}

function gearDetailHtml(name) {
  const g = EXTRA_DATA.gears.find(x => x.name === name);
  if (!g) return '<div class="dp-empty">未找到该装备</div>';
  const w = GEAR_WIKI[g.name] || {};
  let effectSec, descSec = '';
  if (w.basic && w.adv) {
    effectSec = `<h4 class="trait-head">效果<span class="trait-switch gear-switch"><button class="on" data-mode="n">基础</button><button data-mode="e">进阶</button></span></h4>
      <div class="dp-text gear-effect-body" data-gear="${g.name}">${w.basic}</div>`;
    if (w.desc) descSec = `<div class="dp-sec"><h4>描述</h4><div class="dp-text gear-desc">${w.desc}</div></div>`;
  } else {
    const plain = String(g.effect).replace(/^【基础&进阶】/, '');
    let body = plain, flavor = '';
    const q = Math.max(plain.lastIndexOf('“'), plain.lastIndexOf('"'));
    if (q > 0 && /[”"]\s*$/.test(plain)) {
      body = plain.slice(0, q).trim();
      flavor = plain.slice(q).trim();
    }
    effectSec = `<h4>效果</h4><div class="dp-text">${body}</div>`;
    if (flavor) descSec = `<div class="dp-sec"><h4>描述</h4><div class="dp-text gear-desc">${flavor}</div></div>`;
  }
  return `
    <div class="dp-op-head gear-detail">
      <img class="gear-icon-lg" src="gear-icons/${encodeURIComponent(g.icon)}" alt="${g.name}">
      <div class="dp-op-heroinfo">

          <span class="gear-meta-pill price">售价 ${g.price} 资金</span>
        </div>
      </div>
    </div>
    <div class="dp-sec">${effectSec}</div>
    ${descSec}
  `;
}

// ===== SVG 关系图生成器（大盟约连接图 / 小盟约关系图） =====
// 小盟约配色（对齐参考图：精准=绿、迅捷=灰蓝、灵巧=紫、坚守=蓝、不屈=红、奥术=橙、突袭=青、聚合=玫红）
const GRAPH_COV_COLORS = {
  '精准': '#1f9e63', '迅捷': '#5a6b7c', '灵巧': '#8b5cc7', '坚守': '#2f6fd0',
  '不屈': '#d9534f', '奥术': '#d9862b', '突袭': '#2aa5b8', '聚合': '#c0457c',
  '奇迹': '#c9a227', '远见': '#4c8c8c', '助力': '#7a8f3d', '协防干员': '#6e5b8a',
  '投资人': '#a8622e', '独行': '#4a5a66', '调和': '#8a6a9c'
};
const GRAPH_GRAY = '#7d8f86';
function graphCovColor(c) { return GRAPH_COV_COLORS[c] || '#3f6b5e'; }
function graphOpLabel(op) { return op.name + '·' + (tierRoman[op.tier] || op.tier); }
// 估算文字宽度（中日韩字符 ≈ 1em，其余 ≈ 0.55em）
function graphTextW(str, fs) {
  let w = 0;
  for (const ch of str) w += /[\u2e80-\u9fff\u2160-\u217f\uf900-\ufaff\uff00-\uffef]/.test(ch) ? fs : fs * 0.55;
  return w;
}
// 连线上的参数点：直线取线性插值，弧线取二次贝塞尔
function graphPathPoint(p1, p2, ctrl, t) {
  if (ctrl) {
    const u = 1 - t;
    return {
      x: u * u * p1.x + 2 * u * t * ctrl.x + t * t * p2.x,
      y: u * u * p1.y + 2 * u * t * ctrl.y + t * t * p2.y
    };
  }
  return { x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t };
}
// 干员框尺寸（框尽量小，1 行高 24，2 行高 40）
function graphBoxMetrics(rows) {
  return {
    w: Math.max(...rows.map(r => graphTextW(r, 10.5))) + 14,
    h: rows.length * 16 + 8
  };
}
// 干员框一律压在自己的连线上：只沿连线滑动取位，绝不做法向偏移
function graphLayoutOnLines(items, nodes, W, H) {
  const placed = [];
  const hit = (it, x, y) => {
    const x0 = x - it.w / 2, y0 = y - it.h / 2;
    if (x0 < 4 || y0 < 4 || x0 + it.w > W - 4 || y0 + it.h > H - 4) return true;
    for (const p of placed) {

  const legend = [

  if (focusOps.some(o => o.banned)) legend.push({ color: GRAPH_RED, text: '红色：被 Ban 干员所在的线与框' });
  if (banCovs.has(focus) || GRAPH_CORE_RING.some(c => banCovs.has(c))) {
    legend.push({ color: GRAPH_RED, text: '红边盟约：已被禁止（暗红=仍有可用干员，深暗红=相连干员全被 Ban）' });

function buildCovGraph(focus) {

// 小盟约：中心=该小盟约，外圈=与其共现的小盟约；灰线=同时拥有两端小盟约的干员
function buildSmallGraph(focus) {
  const W = 520, H = 520, cx = 260, cy = 254, CENTER_R = 46, RING_R = 182, NODE_R = 26;
  const isSmall = c => !NATION_COV_SET.has(c);
  const ops = operators.map(op => ({
    name: op.干员, tier: op.阶, banned: isOpBanned(op),
    cs: op.盟约.split('、').map(s => s.trim()).filter(Boolean)
  }));
  const focusOps = ops.filter(o => o.cs.includes(focus));
  // 小盟约两两共现（同一干员同时拥有两端）
  const pairOps = {};
  ops.forEach(o => {
    const sm = o.cs.filter(isSmall);
    for (let i = 0; i < sm.length; i++) for (let j = i + 1; j < sm.length; j++) {
      const k = sm[i] < sm[j] ? sm[i] + '|' + sm[j] : sm[j] + '|' + sm[i];
      (pairOps[k] = pairOps[k] || []).push(o);
    }
  });
  const pkey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);
  const pweight = (a, b) => (pairOps[pkey(a, b)] || []).length;

  let ring = [];
  focusOps.forEach(o => o.cs.forEach(c => { if (isSmall(c) && c !== focus && !ring.includes(c)) ring.push(c); }));
  if (ring.length < 6) {
    // 邻居过少时补 2 跳节点：优先与已选集合连线更多的
    const pool = new Set();
    Object.keys(pairOps).forEach(k => {
      const pair = k.split('|'), a = pair[0], b = pair[1];
      if (a === focus || b === focus) return;
      if (ring.includes(a) && !ring.includes(b)) pool.add(b);
      if (ring.includes(b) && !ring.includes(a)) pool.add(a);
    });
    const deg = {};
    Object.keys(pairOps).forEach(k => k.split('|').forEach(n => { deg[n] = (deg[n] || 0) + 1; }));
    const cands = [...pool].sort((x, y) => {
      const sx = ring.reduce((s, m) => s + pweight(x, m), 0);
      const sy = ring.reduce((s, m) => s + pweight(y, m), 0);
      return sy - sx || (deg[y] || 0) - (deg[x] || 0);
    });
    for (const n of cands) { if (ring.length >= 6) break; ring.push(n); }
  }
  // 环形顺序：按共现权重串联，尽量少交叉
  if (ring.length > 2) {
    const left = ring.slice();
    const sumW = n => left.reduce((s, m) => s + (m === n ? 0 : pweight(n, m)), 0);
    let cur = left.reduce((b, n) => (sumW(n) > sumW(b) ? n : b), left[0]);
    const used = [cur];
    left.splice(left.indexOf(cur), 1);
    while (left.length) {
      let nxt = left[0], bw = -1;
      left.forEach(n => { const w = pweight(cur, n); if (w > bw) { bw = w; nxt = n; } });
      used.push(nxt);
      left.splice(left.indexOf(nxt), 1);
      cur = nxt;
    }
    ring = used;
  }

  const legend = [
    { color: GRAPH_BLUE, text: `与「${focus}」共有的干员` },
    { color: GRAPH_GRAY, text: '两个小盟约之间共有的干员' }
  ];
  if (ring.length === 0) return { svg: '' };

  const pos = {};
  ring.forEach((c, i) => {
    const ang = ring.length === 1 ? -Math.PI / 2 : -Math.PI / 2 + (i / ring.length) * Math.PI * 2;
    pos[c] = { x: cx + RING_R * Math.cos(ang), y: cy + RING_R * Math.sin(ang) };
  });

  const edges = [];
  ring.forEach(a => {
    const eops = focusOps.filter(o => o.cs.includes(a));
    if (eops.length) edges.push({ from: null, to: a, ops: eops, orange: false });
  });
  for (let i = 0; i < ring.length; i++) for (let j = i + 1; j < ring.length; j++) {
    const list = (pairOps[pkey(ring[i], ring[j])] || []).filter(o => !o.cs.includes(focus));
    if (list.length) edges.push({ from: ring[i], to: ring[j], ops: list, orange: false });
  }
  if (edges.some(e => e.ops.some(o => o.banned))) legend.push({ color: GRAPH_RED, text: '红色：被 Ban 干员所在的线与框' });
  if (banCovs.has(focus) || ring.some(c => banCovs.has(c))) {
    legend.push({ color: GRAPH_RED, text: '红边盟约：已被禁止（暗红=仍有可用干员，深暗红=相连干员全被 Ban）' });
  }
  // 环上没有画出来的干员：除本小盟约外没有其他“环上小盟约”（例如另有核心盟约）
  const drawnNames = new Set();
  edges.forEach(e => e.ops.forEach(o => drawnNames.add(o.name)));
  const asideOps = focusOps.filter(o => !drawnNames.has(o.name))
    .sort((a, b) => (parseInt(b.tier) || 0) - (parseInt(a.tier) || 0));

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  s += graphDefsSVG();
  // 与大盟约图一致的虚线环，弱化“节点漂浮感”
  s += `<circle cx="${cx}" cy="${cy}" r="${RING_R}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="2 8"/>`;
  edges.forEach(e => {
    const p1 = e.from ? pos[e.from] : { x: cx, y: cy };
    const p2 = pos[e.to];
    const red = e.ops.some(o => o.banned);
    // 中心 → 小盟约的线是“直接关系”，用主色蓝并加大图同款外发光；环间共现线保持灰色
    const direct = !e.from;
    if (direct) {
      const lc = red ? GRAPH_RED : GRAPH_BLUE;
      s += `<line x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}" stroke="${lc}" stroke-width="5" opacity="0.09" stroke-linecap="round"/>`;
      s += `<line x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}" stroke="${lc}" stroke-width="1.7" opacity="${red ? 0.7 : 0.8}" stroke-linecap="round"/>`;
    } else {
      s += `<line x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}" stroke="${red ? GRAPH_RED : GRAPH_GRAY}" stroke-width="1.2" opacity="${red ? 0.6 : 0.38}" stroke-linecap="round"/>`;
    }
  });

  const hitNodes = [{ x: cx, y: cy, r: CENTER_R }].concat(ring.map(c => ({ x: pos[c].x, y: pos[c].y, r: NODE_R })));
  const items = edges.map(e => {
    const p1 = e.from ? pos[e.from] : { x: cx, y: cy };
    const p2 = pos[e.to];
    const rows = e.ops.map(graphOpLabel);
    const bannedRows = e.ops.map(o => !!o.banned);
    // 中心连线按环上位置错开落点，弦线落在中段
    const prefT = e.from ? (ring.indexOf(e.from) % 2 ? 0.64 : 0.52) : (ring.indexOf(e.to) % 2 ? 0.62 : 0.5);
    return Object.assign(
      { p1, p2, rows, bannedRows, anyBanned: bannedRows.some(Boolean), opNames: e.ops.map(o => o.name), stroke: e.from ? GRAPH_GRAY : GRAPH_BLUE, orange: false, prefT, boxOpacity: e.from ? 0.38 : 0.62 },
      graphBoxMetrics(rows)
    );
  });
  graphLayoutOnLines(items, hitNodes, W, H).forEach(it => { s += graphLabelSVG(it); });
  s += graphCenterGlowSVG(cx, cy, CENTER_R);
  s += graphNodeSVG(focus, cx, cy, CENTER_R, true, false, banCovs.has(focus) ? (focusOps.some(o => !o.banned) ? 'half' : 'full') : null);
  // 与外圈节点同一套 Ban 表现：仍有可用干员相连 → 红边半暗，否则红边全暗
  ring.forEach(c => {
    const st = !banCovs.has(c) ? null : (focusOps.some(o => o.cs.includes(c) && !o.banned) ? 'half' : 'full');
    s += graphNodeSVG(c, pos[c].x, pos[c].y, NODE_R, false, false, st);
  });
  s += '</svg>';

  const notes = [`<b>关联小盟约：</b>${ring.join('、')}`];
  return { title: '小盟约关系图 · ' + focus, svg: s, legend, notes, asideOps };
}
function relchartBlock(g) {
  if (!g || !g.svg) return '';
  const legend = (g.legend || []).map(l => `<span class="rel-lg"><i style="background:${l.color}"></i>${l.text}</span>`).join('');
  const notes = (g.notes || []).length ? `<div class="relchart-notes">${g.notes.map(n => `<div>${n}</div>`).join('')}</div>` : '';

    <div class="relchart-top"><div class="relchart-title">${g.title}</div>${g.aside || ''}</div>
    ${g.svg}
    ${legend ? `<div class="relchart-legend">${legend}</div>` : ''}
    ${notes}
  </div>`;
}

// ===== Ban 位系统（档案库入口 · 弹窗多选盟约 · 干员查询过滤） =====

function unbanCount(c) {

// 干员查询：方形干员卡（仅头像 + 名称，无外框；悬停头像加粗变绿；被 Ban 干员灰头像红框）
function opBubble(op, extraCls) {

  return `<div class="op-bubble${banned ? ' banned' : ''}${extraCls ? ' ' + extraCls : ''}" data-name="${op.干员}" data-seltype="op" data-selkey="${op.干员}">

// ===== 干员查询（顶部横向阶级条 + 顶部盟约筛选卡 + 按阶排列干员） =====
const opQueryCovs = new Set(); // 空集合 = 不筛选，按阶级列出全部
let opQueryCovOrder = []; // 盟约点击先后顺序（用于右侧详情：后点的优先）
const opQueryClasses = new Set(); // 技能类型（卡片大类）
const opQueryTriggers = new Set(); // 触发效果
const MECH_COV_ORDER = [...ATTACH_COV_ORDER, ...EXTRA_COV_ORDER];
// 卡片大类：单次叠加 / 持续叠加 同属叠层卡；作战能力 = 战斗卡；整备能力 = 辅助卡
const OP_CLASS_OF_SKILL = { '持续叠加': '叠层卡', '单次叠加': '叠层卡', '作战能力': '战斗卡', '整备能力': '辅助卡', '特异化': '特异化' };
const OP_CLASS_ORDER = ['叠层卡', '战斗卡', '辅助卡', '特异化'];
const OP_CLASS_OVERRIDE = { '星极': '辅助卡' }; // 合成精锐类经济卡
const OP_TRIGGER_ORDER = ['获得时', '进入休整期时', '休整期结束时', '售出时', '刷新时', '战斗中', '战斗增益', '常驻'];
const OP_TRIGGER_TAGS = new Set(['获得时', '进入休整期时', '休整期结束时', '售出时', '刷新时']);
// 同类描述合并：休整期开始时 → 进入休整期时；战斗开始 / 战斗结束时 → 战斗中
const OP_TRIGGER_ALIAS = { '休整期开始时': '进入休整期时', '战斗开始时': '战斗中', '战斗结束时': '战斗中' };
function opCardClass(op) {
  return OP_CLASS_OVERRIDE[op.干员] || OP_CLASS_OF_SKILL[op.技能] || '特异化';
}
// 触发效果：主动触发（部署 / 开启技能 / 击倒 / 被击倒）归「战斗中」，其余战斗期被动效果归「战斗增益」
function opTriggers(op) {
  const trait = op.特质 || '';
  const set = new Set();
  const parts = trait.split(/<([^>]+)>/);
  for (let i = 1; i < parts.length; i += 2) {
    const tag = parts[i];
    const body = parts[i + 1] || '';
    if (tag === '战斗中') {
      if (/(?<!再)部署(?=时|使)/.test(body) || /开启技能时/.test(body) ||
          /敌人[^。；;]*击倒|击倒[^。；;]*敌人/.test(body) || /被击倒/.test(body)) set.add('战斗中');
      else set.add('战斗增益');
    } else if (OP_TRIGGER_ALIAS[tag]) {
      set.add(OP_TRIGGER_ALIAS[tag]);
    } else if (OP_TRIGGER_TAGS.has(tag)) {
      set.add(tag);
    }
  }
  // 无标签的少数干员（如塞雷娅复制“休整期结束时”特质）从正文识别
  if (set.size === 0) {
    OP_TRIGGER_TAGS.forEach(t => { if (trait.includes(t)) set.add(t); });
    Object.keys(OP_TRIGGER_ALIAS).forEach(t => { if (trait.includes(t)) set.add(OP_TRIGGER_ALIAS[t]); });
  }
  if (set.size === 0) set.add('常驻');
  return set;
}
// 盟约筛选 → 右侧详情联动：核心盟约优先，同类取最后点击的那个；都没有则回空态

  const triggerChips = OP_TRIGGER_ORDER.filter(t => triggerCount[t]).map(t => qfChip(t, triggerCount[t], opQueryTriggers.has(t), 'ot')).join('');

  let html = `<div class="tier-tabs">
      <button class="tier-tab" data-filter-jump title="回到顶部，查看盟约 / 技能类型 / 触发效果筛选">条件筛选</button>
      ${tiers.map(t => `<button class="tier-tab" data-tt="${t}">${tierRoman[t]} 阶</button>`).join('')}
    </div>
    <div class="oq-filter">
      <div>
        <div class="cb-sec-title has-reset"><span class="cb-sec-dot core"></span>核心盟约<span class="cb-sec-line"></span><button class="oq-reset" data-reset="cov" title="清空盟约筛选">重置盟约</button></div>
        <div class="cb-list">${nation.map(chip).join('')}</div>
      </div>
      <div>
        <div class="cb-sec-title"><span class="cb-sec-dot attach"></span>附加盟约</div>
        <div class="cb-list">${MECH_COV_ORDER.map(chip).join('')}
          <div class="oq-switches">
            <label class="oq-unsel-switch" title="在每一阶的筛选结果之后补列未被筛中的干员（蓝框）">
              <span class="ban-switch"><input type="checkbox" id="oq-unsel-input"${showUnselected ? ' checked' : ''}><span class="track"></span></span>
              <span>显示未选择干员</span>
            </label>
            <label class="oq-unsel-switch" title="显示被 Ban 的干员（排在每阶蓝框干员之后）">
              <span class="ban-switch"><input type="checkbox" id="ban-show-input"${banShowOps ? ' checked' : ''}><span class="track"></span></span>
              <span>显示 Ban 位干员</span>
            </label>
          </div>
        </div>
      </div>
    </div>
    <div class="oq-filter">
      <div class="cb-sec-title has-reset"><span class="cb-sec-dot core"></span>技能类型<span class="cb-sec-line"></span><button class="oq-reset" data-reset="skill" title="清空技能类型与触发效果">重置技能</button></div>
      <div class="qf-list">${classChips}</div>
      <div class="cb-sec-title"><span class="cb-sec-dot attach"></span>触发效果</div>
      <div class="qf-list">${triggerChips}</div>
    </div>`;
  // 严格按 1→2→3→4→5→6 阶排列；每阶内部顺序：命中筛选 → 蓝框未选中 → 已 BAN
  let shownCount = 0;
  tiers.forEach(t => {
    const tierAll = operators.filter(op => op.阶 === t);
    const matched = filtered.filter(op => op.阶 === t);
    const hit = matched.filter(op => !isOpBanned(op));
    // 被 Ban 干员只在本阶「命中筛选」时出现，且永远排在蓝框干员之后
    const bannedOps = banShowOps ? matched.filter(op => isOpBanned(op)) : [];
    // 未被当前条件选中：蓝框区分，只在本阶命中结果之后补充
    const unsel = showUnselected
      ? tierAll.filter(op => !matched.includes(op) && !isOpBanned(op))
      : [];
    if (hit.length + bannedOps.length + unsel.length === 0) return;
    shownCount += hit.length + bannedOps.length + unsel.length;
    const tips = [
      unsel.length ? `<span class="tier-count-tip unsel">+${unsel.length} 未选中</span>` : '',
      bannedOps.length ? `<span class="tier-count-tip ban">+${bannedOps.length} 已BAN</span>` : ''
    ].join('');
    html += `<div class="tier-list" data-tlist="${t}">
      <div class="tier-list-header">
        <span class="tier-badge ${tierColors[t]}" style="width:54px;height:54px;line-height:54px;font-size:1.1em;">${tierRoman[t]}</span>
        <h3>${tierRoman[t]} 阶干员 (${hit.length + unsel.length + bannedOps.length})${tips}</h3>
      </div>
      <div class="tier-bubbles">
        ${hit.map(op => opBubble(op)).join('')}
        ${unsel.length ? `<div class="tier-split unsel"><span>未满足当前筛选</span></div>${unsel.map(op => opBubble(op, 'unselected')).join('')}` : ''}
        ${bannedOps.length ? `<div class="tier-split ban"><span>已被 BAN</span></div>${bannedOps.map(op => opBubble(op)).join('')}` : ''}
      </div>
    </div>`;
  });
  if (shownCount === 0) {
    html += `<div class="guide-empty">所选筛选条件下暂无干员</div>`;
  }
  view.innerHTML = html;

  // 点击顶部横向阶级按钮 → 平滑滚动到对应阶
  view.querySelectorAll('.tier-tab[data-tt]').forEach(btn => {
    btn.addEventListener('click', () => {
      const list = view.querySelector('.tier-list[data-tlist="' + btn.dataset.tt + '"]');
      if (list) list.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  // 点击「条件筛选」→ 回到本界面顶部，并短暂高亮筛选面板
  view.querySelectorAll('.tier-tab[data-filter-jump]').forEach(btn => {
    btn.addEventListener('click', () => {
      const scroller = view.closest('.app-main');
      if (scroller) scroller.scrollTo({ top: 0, behavior: 'smooth' });
      view.querySelectorAll('.oq-filter').forEach(box => {
        box.classList.remove('oq-flash');
        void box.offsetWidth; // 重置动画
        box.classList.add('oq-flash');
      });
    });
  });
  // 点击盟约筛选 → 切换选中（多选）
  view.querySelectorAll('.cb-chip[data-cb]').forEach(ch => {
    ch.addEventListener('click', () => {
      const c = ch.dataset.cb;
      if (opQueryCovs.has(c)) { opQueryCovs.delete(c); opQueryCovOrder = opQueryCovOrder.filter(x => x !== c); }
      else { opQueryCovs.add(c); opQueryCovOrder = opQueryCovOrder.filter(x => x !== c).concat(c); }
      renderOpQueryView();
      syncOpQueryCovDetail();
    });
  });
  // 点击技能类型筛选 → 切换选中（多选）
  view.querySelectorAll('.qf-chip[data-oc]').forEach(ch => {
    ch.addEventListener('click', () => {
      const v = ch.dataset.oc;
      if (opQueryClasses.has(v)) opQueryClasses.delete(v); else opQueryClasses.add(v);
      renderOpQueryView();
    });
  });
  // 点击触发效果筛选 → 切换选中（多选）
  view.querySelectorAll('.qf-chip[data-ot]').forEach(ch => {
    ch.addEventListener('click', () => {
      const v = ch.dataset.ot;
      if (opQueryTriggers.has(v)) opQueryTriggers.delete(v); else opQueryTriggers.add(v);
      renderOpQueryView();
    });
  });
  // 点击重置 → 清空对应范围的筛选（仅盟约 / 仅技能类型+触发效果）
  view.querySelectorAll('.oq-reset[data-reset]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.reset === 'cov') { opQueryCovs.clear(); opQueryCovOrder = []; }
      else { opQueryClasses.clear(); opQueryTriggers.clear(); }
      renderOpQueryView();
      if (btn.dataset.reset === 'cov') syncOpQueryCovDetail();
    });
  });
  // 「显示未选择干员」开关（独立于 Ban 显示开关）
  const unselInput = view.querySelector('#oq-unsel-input');
  if (unselInput) {
    unselInput.addEventListener('change', () => {
      showUnselected = unselInput.checked;
      localStorage.setItem('wsxy_show_unselected', showUnselected ? '1' : '0');
      renderOpQueryView();
    });
  }
  // 「显示 Ban 位干员」开关（与「显示未选择干员」并排，独立控制是否列出被 Ban 干员）
  const banSwInput = view.querySelector('#ban-show-input');
  if (banSwInput) {
    banSwInput.addEventListener('change', () => {
      banShowOps = banSwInput.checked;
      saveBanState();
      refreshBanViews();
    });
  }
  // 点击气泡 → 选中/取消（右侧详情面板联动）
  view.querySelectorAll('.op-bubble').forEach(b => {
    b.addEventListener('click', () => toggleSelect('op', b.dataset.name));
  });
  syncSelection();
  updateOpTierSpy();
}

// 阶级按钮滚动联动：以滚动区中线落在哪一阶的列表为准，点亮对应阶级
function updateOpTierSpy() {
  const view = document.getElementById('op-query-view');
  if (!view) return;
  const scroller = view.closest('.app-main');
  const tabs = [...view.querySelectorAll('.tier-tab[data-tt]')];
  if (!scroller || tabs.length === 0) return;
  const r = scroller.getBoundingClientRect();
  const mid = r.top + r.height / 2;
  let cur = null;
  for (const list of view.querySelectorAll('.tier-list[data-tlist]')) {
    const b = list.getBoundingClientRect();
    if (b.top > mid) break;
    cur = list.dataset.tlist; // 中线下方最近的一阶
    if (b.bottom > mid) break; // 中线正好落在这一阶内
  }
  tabs.forEach(btn => btn.classList.toggle('active', btn.dataset.tt === cur));
  // 中线还在第一阶列表之上（即停在筛选区）→ 「条件筛选」按钮点亮
  view.querySelectorAll('.tier-tab[data-filter-jump]').forEach(btn => btn.classList.toggle('active', cur === null));
}

// Guide view
const guideCovOrder = [...CORE_COV_ORDER, '通用经济', '通用叠层'];
let guideCov = CORE_COV_ORDER[0]; // 默认展示排序第一的盟约

function sortGuideCats(a, b) {
  const ia = guideCovOrder.indexOf(a.盟约), ib = guideCovOrder.indexOf(b.盟约);
  return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
}

// Build covenant chips
(function buildGuideCovChips() {
  const wrap = document.getElementById('guide-cov-chips');
  const cats = GUIDE_DATA.categories.slice().sort(sortGuideCats);
  cats.forEach(cat => {
    const chip = document.createElement('button');
    chip.className = 'guide-chip';
    chip.dataset.gcov = cat.盟约;
    chip.textContent = cat.盟约;
    chip.classList.toggle('active', cat.盟约 === guideCov);
    wrap.appendChild(chip);
  });
})();

// keepPath=true：从其他栏的详情页跳过来，保留原有路径并追加「攻略 · 盟约」标识
function setGuideCov(c, keepPath) {
  guideCov = c;
  document.querySelectorAll('.guide-chip[data-gcov]').forEach(ch => ch.classList.toggle('active', ch.dataset.gcov === c));
  if (keepPath) {
    if (currentTab() === 'guide') {
      crumbTrail.push({ kind: 'page', tab: 'guide', label: '攻略 · ' + c });
      renderGuideView();
      renderDetailPanel();
    } else {
      switchTab('guide', 'preserve', { label: '攻略 · ' + c });
    }
    return;
  }
  // 攻略栏内切换盟约：攻略是顶层平行界面，路径以「攻略 · 新盟约」为根
  resetGuideTrail();
  if (currentTab() !== 'guide') {
    switchTab('guide', 'preserve', { silent: true });
  } else {
    renderGuideView();
    renderDetailPanel();
  }
}
document.querySelectorAll('.guide-chip[data-gcov]').forEach(ch => ch.addEventListener('click', () => setGuideCov(ch.dataset.gcov)));

// 拆分盟约描述：提取「激活所需人数 N」徽章，正文剔除该前缀，
// 并把 <在场/达到/每叠加/首次到达 …> 触发条件转成浅绿换行高亮
function covDescParts(name) {
  const raw = covenants[name] || '';
  const m = raw.match(/^激活所需人数\s*(\d+)\s*/);
  const need = m ? m[1] : '';
  const body = (m ? raw.slice(m[0].length) : raw)
    .replace(/<([^>]+)>/g, (mm, p1) => `<span class="cov-cond">&lt;${p1}&gt;</span>`)
    .trim();
  return { need, body };
}

function renderGuideView() {
  const view = document.getElementById('guide-view');
  const cat = GUIDE_DATA.categories.find(c => c.盟约 === guideCov);
  if (!cat) { view.innerHTML = '<div class="guide-empty">未找到该盟约攻略</div>'; return; }
  const covParts = covDescParts(cat.盟约);
  const covOpCount = operators.filter(op => op.盟约.split('、').includes(cat.盟约)).length;
  let html = `<div class="guide-cov-header"><h2>【${cat.盟约}】盟约 · 攻略${covParts.need ? `<span class="cov-need-badge">激活所需 ${covParts.need} 人</span>` : ''}</h2></div>`;
  if (covParts.body) {
    html += `<div class="guide-cov-desc">${covParts.body}
      <div class="guide-cov-desc-foot"><span class="cov-op-count-badge">${covOpCount} 名干员</span></div>
    </div>`;
  }
  if (cat.核心) html += `<div class="guide-cov-core">构筑核心：${cat.核心}</div>`;
  let shown = 0;
  cat.分组.forEach(group => {
    const members = group.干员
      .map(name => GUIDE_DATA.items.find(i => i.干员 === name && i.盟约 === cat.盟约) || GUIDE_DATA.items.find(i => i.干员 === name))
      .filter(Boolean);
    if (members.length === 0) return;
    shown += members.length;
    html += `<div class="guide-group">
      <div class="guide-group-title">${group.定位} <span style="color:var(--text-dim);font-size:0.85em;">(${members.length})</span></div>
      <div class="guide-cards">
        ${members.map(it => guideCard(it, cat.盟约, group.定位)).join('')}
      </div>
    </div>`;
  });
  if (shown === 0) html += `<div class="guide-empty">该盟约暂无对应干员</div>`;
  view.innerHTML = html;
  // Bind card clicks → 右侧详情面板（选中/取消）
  view.querySelectorAll('.guide-card').forEach(card => {
    card.addEventListener('click', () => {
      const name = card.dataset.name;
      if (selType === 'op' && selKey === name) {
        // 再次点击同一张卡 → 只回退这一层，不重置整条路径
        if (crumbTrail.length && crumbTrail[crumbTrail.length - 1].kind === 'item') crumbTrail.pop();
        renderDetailPanel();
      } else {
        showDetail('op', name, true);
      }
    });
  });
  syncSelection();
}

function guideCard(it, cov, pos) {
  const tierBadge = it.阶 ? `<span class="tier-badge ${tierColors[it.阶] || ''}">${tierRoman[it.阶] || it.阶}</span>` : '';
  const tags = (it.干员盟约 || '').split(/[、,，]/).filter(Boolean).map(c => `<span class="guide-cov-tag" ${covStyle(c)}>${c}</span>`).join('');
  const cls = opClass(it.干员);
  const opData = operators.find(o => o.干员 === it.干员);
  const banned = opData ? isOpBanned(opData) : false;
  return `<div class="guide-card${banned ? ' banned' : ''}" data-name="${it.干员}" data-cov="${cov}" data-seltype="op" data-selkey="${it.干员}">
    <div class="guide-card-top">

    <div class="guide-card-pos"><span class="pos-badge ${posClass(pos)}">${pos}</span></div>
    <div class="guide-card-covs">${tags}</div>
  </div>`;
}

  }
  view.innerHTML = `<div class="enemy-section">
      <div class="enemy-section-title">领袖 · Boss</div>
      <div class="enemy-leader-grid">
        ${EXTRA_DATA.enemies.leaders.map(l => `
          <div class="enemy-leader-card" data-enemy="L:${l.name}" data-seltype="enemy" data-selkey="L:${l.name}">
            <img class="enemy-leader-avatar" src="${enemyAvatarUrl(l.avatar)}" alt="${l.name}" loading="lazy" onerror="this.style.display='none'">
            <div class="enemy-leader-name">${l.name}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="enemy-section">
      <div class="enemy-section-title">战术特训 · 敌方分组</div>
      <div class="enemy-train-grid">
        ${EXTRA_DATA.enemies.training.map(g => `
          <div class="enemy-train-card">
            <div class="enemy-train-card-head" data-enemy="T:${g.group}" data-seltype="enemy" data-selkey="T:${g.group}">
              <span class="enemy-train-card-name">${g.group}</span>
              <span class="enemy-train-card-count">${g.members.length} 名敌方单位</span>
            </div>
            <div class="enemy-train-card-desc">${g.desc}</div>

  view.querySelectorAll('[data-enemy]').forEach(el => {
    el.addEventListener('click', () => toggleSelect('enemy', el.dataset.enemy));

}
function enemyDetailHtml(key) {
  if (key.indexOf('T:') === 0) {
    const group = key.slice(2);
    const g = EXTRA_DATA.enemies.training.find(x => x.group === group);
    if (!g) return '<div class="dp-empty">未找到该分组</div>';
    return `
      <div class="dp-op-head">
        <div class="enemy-train-badge" style="width:90px;height:90px;border-radius:3px;flex-shrink:0;">${g.group.slice(0, 2)}</div>
        <div class="dp-op-heroinfo">
          <h2>${g.group}</h2>
          <div class="dp-op-tags">
            <span class="skill-type">战术特训 · 敌方分组</span>
            <span class="skill-type">${g.members.length} 名敌方单位</span>
          </div>
        </div>
      </div>
      <div class="dp-sec"><h4>分组描述</h4><div class="dp-text">${g.desc}</div></div>
      <div class="dp-sec"><h4>敌方单位</h4>
        <div class="enemy-mini-grid large">${g.members.map(m => enemyMiniHtml(m)).join('')}</div>
      </div>
    `;
  }
  if (key.indexOf('J:') === 0) {
    const j = MUTATION_DATA.joint.find(x => x.name === key.slice(2));
    if (!j) return '<div class="dp-empty">未找到该增益</div>';
    return `
      <div class="enemy-dp-head">
        <span class="enemy-dp-code">联合增益</span>
        <div>
          <h2>${j.name}</h2>
          <div class="enemy-dp-sub">机变阶段</div>
        </div>
      </div>
      <div class="dp-sec"><h4>效果</h4><div class="dp-text">${j.effect}</div></div>
    `;
  }
  if (key.indexOf('M:') === 0) {
    const r = MUTATION_DATA.rotation[+key.slice(2)];
    if (!r) return '<div class="dp-empty">未找到该悬赏</div>';
    const e = mutEnemyOf(r.base);
    const x = enemyExtraOf(e);
    const grades = (e && e.g) || {};
    const code = (e && e.id) || (x && x.id) || '—';
    const w = e && e.w != null ? e.w : (x && x.w);
    const desc = (e && e.desc) || (x && x.desc);
    const sub = e ? [e.lv, e.atk, e.dmg].filter(v => v && v !== '无').join(' · ') : '';
    const cost = r.cost > 0 ? `资金 +${r.cost}` : '无资金';
    return `
      <div class="enemy-dp-head">
        <span class="enemy-dp-code">${code}</span>
        <div>
          <h2>${r.base}</h2>
          <div class="enemy-dp-sub">${sub}</div>
          <div class="dp-op-tags" style="margin-top:6px;"><span class="skill-type">${r.name}</span><span class="skill-type">${cost}</span></div>
        </div>
      </div>
      <div class="enemy-stats-layout">
        <div class="enemy-stats-left">
          ${e ? `<img class="enemy-dp-big-avatar" src="${enemyAvatarUrl(e.icon)}" alt="${r.base}" onerror="this.style.display='none'">` : ''}
          ${w != null ? `<div class="enemy-weight">重量 ${w}</div>` : ''}
        </div>
        <div class="enemy-stats-right">${enemyGradeHtml(grades, x && x.lv[0])}</div>
      </div>
      ${enemyLevelHtml(x, e && e.n)}
      ${enemyResistHtml(x)}
      ${r.desc ? `<div class="dp-sec"><h4>悬赏说明</h4><div class="dp-text">${r.desc}</div></div>` : ''}
      ${desc ? `<div class="dp-sec"><h4>描述</h4><div class="dp-text enemy-dp-desc">${desc}</div></div>` : ''}
      ${e && e.ab && e.ab.length ? `<div class="dp-sec"><h4>能力</h4><ul class="enemy-ability-list">${e.ab.map(a => `<li>${a.replace(/^·\s*/, '')}</li>`).join('')}</ul></div>` : ''}
      ${e && e.groups && e.groups.length ? `<div class="dp-sec"><h4>所属分组</h4><div class="enemy-group-links">${e.groups.map(g => `<span class="enemy-group-link" data-group="${g}">${g}</span>`).join('')}</div></div>` : ''}
    `;
  }
  if (key.indexOf('E:') === 0) {
    const e = ENEMY_BY_NAME[key.slice(2)];
    if (!e) return '<div class="dp-empty">未找到该敌人</div>';
    const x = enemyExtraOf(e);
    const groups = e.groups || [];
    const w = e.w != null ? e.w : (x && x.w);
    const desc = e.desc || (x && x.desc);
    const sub = [e.lv, e.atk, e.dmg].filter(v => v && v !== '无').join(' · ');
    return `
      <div class="enemy-dp-head">
        <span class="enemy-dp-code">${e.id || (x && x.id) || '—'}</span>
        <div>
          <h2>${e.n}</h2>
          <div class="enemy-dp-sub">${sub}</div>
        </div>
      </div>
      <div class="enemy-stats-layout">
        <div class="enemy-stats-left">
          <img class="enemy-dp-big-avatar" src="${enemyAvatarUrl(e.icon)}" alt="${e.n}" onerror="this.style.display='none'">
          <div class="enemy-weight">重量 ${w != null ? w : '-'}</div>
        </div>
        <div class="enemy-stats-right">${enemyGradeHtml(e.g || {}, x && x.lv[0])}</div>
      </div>
      ${enemyLevelHtml(x, e.n)}
      ${enemyResistHtml(x)}
      ${desc ? `<div class="dp-sec"><h4>描述</h4><div class="dp-text enemy-dp-desc">${desc}</div></div>` : ''}
      ${(e.ab && e.ab.length) ? `<div class="dp-sec"><h4>能力</h4><ul class="enemy-ability-list">${e.ab.map(a => `<li>${a.replace(/^·\s*/, '')}</li>`).join('')}</ul></div>` : ''}
      ${groups.length ? `<div class="dp-sec"><h4>所属分组</h4><div class="enemy-group-links">${groups.map(g => `<span class="enemy-group-link" data-group="${g}">${g}</span>`).join('')}</div></div>` : ''}
    `;
  }
  const name = key.replace(/^L:/, '');
  const l = EXTRA_DATA.enemies.leaders.find(x => x.name === name);
  if (!l) return '<div class="dp-empty">未找到该敌人</div>';
  const s = l.stats || {};
  const weight = l.weight != null ? `<div class="enemy-weight">重量 ${l.weight}</div>` : '';
  const types = (l.type || []).map(t => `<span class="skill-type">${t}</span>`).join('');
  const grades = { hp: s.生命值, spd: s.移动速度, atk: s.攻击力, aspd: s.攻击速度, def: s.防御力, eres: s.元素抗性, res: s.法术抗性, dres: s.损伤抵抗 };
  return `
    <div class="enemy-dp-head">
      <span class="enemy-dp-code">${l.id || '—'}</span>
      <div>
        <h2>${l.name}</h2>
        <div class="dp-op-tags"><span class="skill-type">领袖 · Boss</span>${types}</div>
      </div>
    </div>
    <div class="enemy-stats-layout">
      <div class="enemy-stats-left">
        <img class="enemy-dp-big-avatar" src="${enemyAvatarUrl(l.avatar)}" alt="${l.name}" onerror="this.style.display='none'">
        ${weight}
      </div>
      <div class="enemy-stats-right">${enemyGradeHtml(grades)}</div>
    </div>
    ${l.desc ? `<div class="dp-sec"><h4>描述</h4><div class="dp-text">${l.desc}</div></div>` : ''}
    <div class="dp-sec"><h4>各模拟难度生命值</h4>
      <table class="enemy-hp-table">
        <tbody>
          ${ENEMY_HP_ROWS.map(([k, label]) => `<tr><th>${label}</th>${hpCell(l[k])}</tr>`).join('')}
        </tbody>
      </table>
      <div class="enemy-dp-note"><span style="color:#ff9a9a;font-weight:bold;">红色数值</span>为「隐秘核心」的生命值。</div>
    </div>
  `;
}
document.querySelectorAll('.enemy-filter-btn[data-enemy-group]').forEach(ch => {
  ch.addEventListener('click', () => {
    enemyGroup = ch.dataset.enemyGroup;
    document.querySelectorAll('.enemy-filter-btn[data-enemy-group]').forEach(c => c.classList.toggle('active', c.dataset.enemyGroup === enemyGroup));
    resetCrumbForCurrentTab();
    selType = null; selKey = null;
    renderEnemyView();
    renderDetailPanel();
  });
});

// ===== 代理人图鉴（卫戍协议 · 策略卡：网格卡 + 右侧详情面板） =====
function strategyAvatarHtml(sponsor, cls) {
  cls = cls || 'strategy-card-avatar';
  // 绿色主题头像：PRTS wiki 卫戍协议·盟约_策略发起人_<干员名>.png（文件名去除引号字符）
  const fname = '卫戍_' + sponsor.replace(/[“”"]/g, '') + '.png';
  return `<img class="${cls}" src="avatars/${encodeURIComponent(fname)}" alt="${sponsor}" loading="lazy" onerror="this.onerror=null;this.src='avatars/${encodeURIComponent('头像_策略发起人.png')}'">`;
}
// 策略专属阵营：效果文本中以 <阵营> 或 【阵营】 标注的盟约
function strategyCovs(s) {
  return Object.keys(covenants).filter(c => s.effect.includes('<' + c + '>') || s.effect.includes('【' + c + '】'));
}
function isStrategyBanned(s) {
  return strategyCovs(s).some(c => banCovs.has(c));
}
// 盟约型策略主阵营：效果文本中第一个出现的【盟约】；无则视为泛用型
function strategyPact(s) {
  for (const c of Object.keys(covenants)) {
    if (s.effect.includes('【' + c + '】')) return c;
  }
  return '';
}
// 使用方式标签：被动 / 拖拽 · 消耗 N / 点击 · 消耗 N
function strategyUseLabel(s) {
  const cost = (s.effect.match(/消耗(\d)/) || [])[1];
  return s.use + (cost !== undefined ? ` · 消耗 ${cost}` : '');
}
function renderStrategyView() {
  const view = document.getElementById('strategy-view');
  const generic = EXTRA_DATA.strategies.filter(s => strategyPact(s) === '');
  const pact = EXTRA_DATA.strategies.filter(s => strategyPact(s) !== '');
  const cardHtml = s => `
      <div class="strategy-card ${isStrategyBanned(s) ? 'banned' : ''}" data-sponsor="${s.sponsor}" data-seltype="strategy" data-selkey="${s.sponsor}">
        <span class="strategy-avatar-box">${strategyAvatarHtml(s.sponsor)}</span>
        <div class="strategy-card-name">${s.name}</div>
        <div class="strategy-card-meta">
          <span class="strategy-use-badge">${strategyUseLabel(s)}</span>
          <span class="strategy-hp-badge">${s.hp} 生命</span>
        </div>
      </div>`;
  let html = '';
  if (generic.length) {
    html += `<div class="guide-group">
      <div class="guide-group-title">泛用型策略 <span style="color:var(--text-dim);font-size:0.85em;">(${generic.length})</span></div>
      <div class="strategy-grid">${generic.map(cardHtml).join('')}</div>
    </div>`;
  }
  if (pact.length) {
    html += `<div class="guide-group">
      <div class="guide-group-title">盟约型策略 <span style="color:var(--text-dim);font-size:0.85em;">(${pact.length})</span></div>
      <div class="strategy-grid">${pact.map(cardHtml).join('')}</div>
    </div>`;
  }
  view.innerHTML = html;
  view.querySelectorAll('.strategy-card').forEach(card => {
    card.addEventListener('click', () => toggleSelect('strategy', card.dataset.sponsor));
  });
  syncSelection();
}
function strategyDetailHtml(sponsor) {
  const s = EXTRA_DATA.strategies.find(x => x.sponsor === sponsor);
  if (!s) return '<div class="dp-empty">未找到该策略</div>';
  const bannedCovs = strategyCovs(s).filter(c => banCovs.has(c));
  const banned = bannedCovs.length > 0;
  const pact = strategyPact(s);
  return `
    <div class="dp-op-head">
      <span class="strategy-dp-box ${banned ? 'banned' : ''}">${strategyAvatarHtml(sponsor, 'strategy-dp-avatar')}</span>
      <div class="dp-op-heroinfo">
        <h2>${s.name}</h2>
        <div class="dp-op-tags">
          <span class="skill-type">发起人 · ${s.sponsor}</span>
          <span class="strategy-use-badge">${strategyUseLabel(s)}</span>
          <span class="strategy-hp-badge">${s.hp} 生命</span>
          ${pact ? `<span class="strategy-pact-badge" ${covStyle(pact)}>盟约型 · 【${pact}】</span>` : `<span class="strategy-pact-badge strategy-generic">泛用型</span>`}
        </div>
        ${banned ? `<div class="strategy-banned-note">关联的${bannedCovs.join('、')}盟约已有干员被禁用，该策略效果可能无法完整发挥</div>` : ''}
      </div>
    </div>
    <div class="dp-sec"><h4>策略效果</h4><div class="dp-text">${s.effect}</div></div>
    <div class="dp-sec"><h4>解锁条件</h4><div class="dp-text">${s.unlock}</div></div>
  `;
}

// ===== 装备图鉴（左列表：图标+名称+售价；右详情面板） =====
let gearTier = 'all';
let gearSearch = '';
let gearSearchBound = false;
// 阵营标签：装备名称/效果/图标中命中任一盟约名即打上该阵营标签，供阵营关键词搜索
const GEAR_FACTION_TAGS = Object.keys(covenants);
function gearSearchText(g) {
  const tags = GEAR_FACTION_TAGS.filter(f => (g.name + g.effect + g.icon).includes(f));
  return (g.name + ' ' + g.type + ' ' + g.effect + ' ' + tags.join(' ')).toLowerCase();
}
function renderGearView() {
  const tabsEl = document.getElementById('gear-tabs');
  const listEl = document.getElementById('gear-list');
  const groups = ['1', '2', '3', '4', '5', '6'];
  // 顶部横向阶级按钮条：点击平滑滚动到对应阶级（与干员查询一致）
  if (tabsEl) {
    tabsEl.innerHTML = groups.map(t => `<button class="tier-tab" data-tt="${t}">${tierRoman[t]} 阶</button>`).join('');
    tabsEl.querySelectorAll('.tier-tab[data-tt]').forEach(btn => {
      btn.addEventListener('click', () => {
        const scroller = tabsEl.closest('.app-main');
        if (!scroller) return;
        // Ⅰ 阶的起点算上搜索框：直接回到列表顶部（搜索框就在吸顶按钮条下方）
        if (btn.dataset.tt === '1') {
          scroller.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        const group = document.querySelector('#gear-list .guide-group[data-ggroup="' + btn.dataset.tt + '"]');
        if (!group) return;
        // 扣掉吸顶按钮条高度，避免标题被压在按钮条下面
        const top = group.getBoundingClientRect().top - scroller.getBoundingClientRect().top
          + scroller.scrollTop - tabsEl.offsetHeight;
        scroller.scrollTo({ top, behavior: 'smooth' });
      });
    });
  }
  let list = EXTRA_DATA.gears.slice();
  if (gearTier !== 'all') list = list.filter(g => g.tier === gearTier);
  if (gearSearch) {
    const s = gearSearch.toLowerCase().replace(/奥数/g, '奥术');
    list = list.filter(g => gearSearchText(g).includes(s));
  }
  let html = '';
  groups.forEach(t => {
    const tierGears = list.filter(g => g.tier === t);
    if (tierGears.length === 0) return;
    html += `<div class="guide-group" data-ggroup="${t}">
      <div class="guide-group-title">${tierRoman[t]} 阶装备 <span style="color:var(--text-dim);font-size:0.85em;">(${tierGears.length})</span></div>
      <div class="gear-bubbles">
        ${tierGears.map(g => `
          <div class="gear-bubble" data-name="${g.name}" data-seltype="gear" data-selkey="${g.name}">
            <img class="gear-bubble-icon" src="gear-icons/${encodeURIComponent(g.icon)}" alt="${g.name}" loading="lazy" onerror="this.style.display='none'">
            <div class="gear-bubble-name-row">
              <span class="gear-coin">${g.price}</span>
              <div class="gear-bubble-name">${g.name}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>`;
  });
  if (list.length === 0) html += '<div class="guide-empty">没有符合条件的装备</div>';
  if (listEl) {
    listEl.innerHTML = html;
    listEl.querySelectorAll('.gear-bubble').forEach(row => {
      row.addEventListener('click', () => toggleSelect('gear', row.dataset.name));
    });
  }
  syncSelection();
  const box = document.getElementById('gear-search');
  if (box && !gearSearchBound) {
    gearSearchBound = true;
    box.addEventListener('input', () => { gearSearch = box.value.trim(); renderGearView(); });
  }
  if (box) box.value = gearSearch;
  updateGearTierSpy();
}

// 装备图鉴阶级按钮滚动联动：以列表可视区最顶端为准（吸顶按钮条下方），
// 顶端还在 Ⅰ 阶之前（即停在搜索框区域）时点亮 Ⅰ 阶
function updateGearTierSpy() {
  const view = document.getElementById('tab-gear');
  if (!view || !view.classList.contains('active')) return;
  const scroller = view.closest('.app-main');
  const tabsEl = document.getElementById('gear-tabs');
  if (!scroller || !tabsEl) return;
  const tabs = [...tabsEl.querySelectorAll('.tier-tab[data-tt]')];
  if (!tabs.length) return;
  const threshold = tabsEl.getBoundingClientRect().bottom + 8;
  let cur = '1';
  view.querySelectorAll('#gear-list .guide-group[data-ggroup]').forEach(g => {
    if (g.getBoundingClientRect().top <= threshold) cur = g.dataset.ggroup;
  });
  tabs.forEach(btn => btn.classList.toggle('active', btn.dataset.tt === cur));
}

// Init
applyFilters();
renderCovDir();
renderDetailPanel();

// 干员查询：滚动时同步阶级按钮高亮（用 rAF 节流）
(function bindOpTierSpy() {
  let raf = 0;
  document.addEventListener('scroll', e => {
    const t = e.target;
    if (!(t instanceof Element) || !t.classList.contains('app-main')) return;
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; updateOpTierSpy(); updateGearTierSpy(); });
  }, true);
})();
